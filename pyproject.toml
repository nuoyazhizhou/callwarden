[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "callwarden"
version = "0.3.23"
description = "Call Warden - AI Agent 的代码知识图谱工具，多语言代码分析、版本管理、缺陷检测"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Call Warden Team" }
]
keywords = ["code-analysis", "call-graph", "tree-sitter", "mcp", "semgrep", "ai-agent"]
dependencies = [
    # P1-G（2026-07-25）：Python tree-sitter 核心和 16 种 grammar wheel 已从默认
    # 依赖移到 `parser-reference` extra。生产解析统一由 Rust callwarden_core 完成，
    # Python parser 保留在源码仓库作为开发 reference，通过 `pip install -e .[parser-reference]`
    # 或 `pip install -e .[dev]`（dev 自动包含 parser-reference）安装。
    # 设计：rust-only-parser-cutover-plan.md §8 Phase 5 步骤 5。
    # A15 (2026-07-20): pathspec 提供完整 gitignore 语义支持（字符类/尾随空格/negation）
    # 仅 pathspec 不可用时降级到自研实现（不完整）
    "pathspec>=0.10",
    "mcp[rich]>=1.28,<2",
    "watchdog>=6.0.0",
    "numpy>=1.24",
    "semgrep>=1.50",
    "tomli>=2.0.0; python_version < '3.11'",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
cw = "callwarden.cw:main"
cw-client = "callwarden.cli.client:main"
cw-agent = "callwarden.cli.agent:main"
cw-daemon = "callwarden.cli.daemon:main"

[project.optional-dependencies]
all = [
    # P1-G（2026-07-25）：`all` 不再包含 Python tree-sitter parser，parser 通过
    # `parser-reference` extra 单独安装。`all` 仍包含其他可选能力（semgrep/vector）。
    # A15 (2026-07-20): pathspec 提供完整 gitignore 语义支持
    "pathspec>=0.10",
    "mcp[rich]>=1.28,<2",
    "watchdog>=6.0.0",
    "semgrep>=1.50",
    "sentence-transformers>=2.2",
    "sqlite-vec>=0.1",
    "numpy>=1.24",
]
core = [
    # P1-G（2026-07-25）：core 不再包含 tree-sitter，生产解析由 Rust 完成。
    # A15 (2026-07-20): pathspec 提供完整 gitignore 语义支持
    "pathspec>=0.10",
    "mcp[rich]>=1.28,<2",
    "watchdog>=6.0.0",
]
semgrep = ["semgrep>=1.50"]
vector = [
    "sentence-transformers>=2.2",
    "sqlite-vec>=0.1",
    "numpy>=1.24",
]
# P1-G（2026-07-25）：Python parser reference extra。
# 仅用于开发期 alignment、回归定位和旧版本对照，不进入默认 wheel 和 PyInstaller
# 冻结包（PyInstaller 通过 callwarden.spec 的 _PARSER_GRAMMAR_EXCLUDES 排除）。
# 版本下限保持与历史 dependencies 一致，避免 alignment baseline 漂移；
# 正式发布包不安装此 extra。
# 设计：rust-only-parser-cutover-plan.md §3.1 目标 9、§8 Phase 5 步骤 5。
parser-reference = [
    "tree-sitter>=0.21",
    "tree-sitter-rust>=0.21",
    "tree-sitter-typescript>=0.21",
    "tree-sitter-python>=0.21",
    "tree-sitter-kotlin>=0.21",
    "tree-sitter-go>=0.21",
    "tree-sitter-java>=0.21",
    "tree-sitter-c>=0.21",
    "tree-sitter-cpp>=0.21",
    "tree-sitter-javascript>=0.21",
    "tree-sitter-c-sharp>=0.21",
    "tree-sitter-ruby>=0.21",
    "tree-sitter-php>=0.22",
    "tree-sitter-swift>=0.5",
    "tree-sitter-scala>=0.23",
    "tree-sitter-hcl>=0.21",
    "tree-sitter-elixir>=0.3",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "build>=1.0",
    "twine>=5.0",
    # P1-G：开发测试需要 Python parser reference（contract/alignment 测试依赖）。
    # 通过 `pip install -e .[dev]` 自动拉入 parser-reference extra。
    "callwarden[parser-reference]",
]

[tool.setuptools]
package-dir = { "callwarden" = "." }
packages = [
    "callwarden",
    "callwarden.analyzers",
    "callwarden.cicd",
    "callwarden.cli",
    # db/ 退休验收③（路线 B）：db/ 已降级为**仅测试支持层**——生产侧零导入
    # （tests/convergence/test_db_retire_prod_purity.py 锁定导入期 purity），
    # 故不进生产 wheel。源码树与 sdist 仍保留 db/ 供测试使用
    # （MANIFEST.in 的 recursive-include db *.py）。
    "callwarden.i18n",
    "callwarden.parsers",
    "callwarden.server",
    "callwarden.server.tools",
]
# P0-3 修复：让 wheel 包含根目录的 Rust 扩展二进制（callwarden_core.pyd/.so）
# setuptools 的 py-modules 只识别 .py 文件，不识别 .pyd/.so；
# 必须用 ext-modules + BinaryDistribution(setup.py) 让 setuptools 把 .pyd 当作
# 预编译扩展模块包含到 wheel 中（参考 setup.py 的 BinaryDistribution）
# wheel 平台标记由 setup.py 的 BinaryDistribution.has_ext_modules()=True 自动设置
ext-modules = [
    { name = "callwarden_core", sources = [] },
]

[tool.setuptools.package-data]
callwarden = [
    "i18n/*.json",
]

[tool.pyrefly]
# mcp/watchdog 等运行时依赖通过 pip install --user 安装到用户级 site-packages
# （C:\Users\wanpi\AppData\Roaming\Python\Python314\site-packages），
# Pyrefly 环境自动探测的解释器（系统 Python + .venv_test）不包含 user scheme，
# 静态检查时无法解析 mcp.server.fastmcp 等 import，需手动补充 site-package-path。
# 若迁移到 venv 安装依赖，可删除此项让 autoconfiguration 自动探测。
site-package-path = ["C:/Users/wanpi/AppData/Roaming/Python/Python314/site-packages"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["testcode", "build", "dist", "rust_ext", ".git"]
# 注意：--cov 故意不放进 addopts。pytest-cov 未安装的环境（如本机）会把
# --cov 当成未识别参数，导致所有 pytest 调用硬失败。覆盖率采集由 CI 的
# test job 显式传 --cov（见 .github/workflows/ci.yml），本地调试不受影响。
addopts = "-q --tb=short"
markers = [
    "xdist_group(name): 将测试分组，避免多个测试同时创建/删除相同临时文件",
]

# ============================================================
# Ruff lint 门禁（CI-DEBT CD-2，2026-10-16）
# ============================================================
# 仓库此前零 ruff 配置：CI 的 lint job 安装 ruff 0.17.x 后跑默认规则集
# （UP/I/SIM/BLE/S/PLW/RUF/PIE/TRY/FURB/RET/LOG/PERF/ISC 等现代化建议），
# 全量 9927 条告警使门禁常红、噪声掩盖真实缺陷。此处显式 select 回归
# 「错误类」规则——未定义/未使用绑定、导入与语句级错误、运行时必错、
# 无效转义——让门禁恢复「红 = 存在真实错误」。
# 现代化建议类规则不在本卡处置，剩余账目登记在本段末尾外挂修复清单。
[tool.ruff.lint]
select = [
    # E4 导入类格式错误：E401 一行多导入、E402 导入不在文件顶部等。
    # 导入错乱会掩盖真实依赖结构，修复机械、无行为风险。
    "E4",
    # E7 语句级错误：E711/E712 与字面量比较（== True）、E721 类型比较、
    # E722 bare except、E731 lambda 赋值、E741 歧义变量名（l/I/O）。
    # 其中 E722/E741 是潜在真实 bug，E712 等为可读性。
    "E7",
    # E9 运行时必错类：E999 syntax error、E902 IO 错误。CI 门禁的
    # 底线——任何 E9 都意味着文件无法被解释器加载。
    "E9",
    # F pyflakes 核心：F821 未定义名、F401 未使用导入、F841 未使用
    # 变量、F541 f-string 无占位符、F811 重复定义。F821 是本卡重点
    # （真修×41 + 惰性模式行级 noqa×30，见 7a274fd/46419ac/cce004d）。
    "F",
    # W605 无效转义序列：正则与字符串中的 \ 错写，在部分 Python
    # 版本触发 DeprecationWarning 乃至 SyntaxWarning，属潜在真实 bug。
    "W605",
]
# 外挂修复清单（select 后门禁仍红的真实账目，独立债务卡处置，不掩
# 盖、不 noqa）：F401 未使用导入×715 / F541 f-string 无占位符×259 /
# F841 未使用变量×213 / E402 导入不在顶部×195 / E702 一行多语句×41 /
# E741 歧义变量名×38 / F811 重复定义×18 / E401 一行多导入×16 /
# E701 单行 if/while 冒号×8 / W605 无效转义×6 / E722 bare except×4 /
# E731 lambda 赋值×4 / E712 与字面量比较×4 —— 合计 1521 条
# （截至 cce004d，本地 ruff 0.17.0；CI 用 0.17.1，可能有 ±数条漂移）。
# 其中 E722×4 与 W605×6 建议优先（潜在 bug 类），其余多为重构清理。

# ============================================================
# 覆盖率门禁（任务5①，2026-10-13）
# ============================================================
# 采集范围与安全门禁（.github/workflows/ci.yml security job 的 bandit）保持
# 同一「核心生产面」：cli/（84 命令入口）+ server/（MCP 243 工具 + daemon
# client + autostart）+ 根入口 cw.py/config.py。
# 不取 "callwarden" 整包的原因：仓库根本身即 callwarden 包
# （package-dir = { "callwarden" = "." }，从父目录挂载为 callwarden），
# source 写 "callwarden" 会把整个仓库根（tests/、deliverables/、scripts/、
# rust_ext/ 等）全算进覆盖率分母，门禁数字失去生产含义。
# analyzers/parsers/cicd 暂不纳入：parsers/ 明确是开发 reference（生产解析
# 由 Rust callwarden_core 完成，见上方 P1-G 注释），纳入会惩罚本就不该被
# 生产测试覆盖的代码；待生产/引用地位界定后再加入本列表。
[tool.coverage.run]
source = [
    "cli",
    "server",
    "cw.py",
    "config.py",
]
relative_files = true
branch = true
omit = [
    # 兜底：测试样本与 runner 不计入生产覆盖率
    "*/tests/*",
    "*/testcode/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
# 覆盖率阈值：首次接线设保守基线 40%，待 CI 跑出真实全量数字后逐轮抬升
# （阈值裁定属流程·度量域）。pytest-cov 在未显式传 --cov-fail-under 时会读
# 此值作为门禁，低于即该步骤失败。
fail_under = 40
