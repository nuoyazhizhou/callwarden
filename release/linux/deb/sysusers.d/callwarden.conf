# Call Warden sysusers.d 配置（打包占位文件）
# Task: T-1783983162956-b2a8
# 设计 §8.2: 创建 callwarden 服务账户和 callwarden-clients 连接组
# 安装路径: /usr/lib/sysusers.d/callwarden.conf
# 由 systemd-sysusers 在启动时读取并创建用户/组。

# 创建 callwarden 系统用户（daemon 服务账户）
u callwarden - "Call Warden daemon" /var/lib/callwarden /usr/sbin/nologin

# 创建 callwarden-clients 连接组（client/agent 通过此组访问 UDS socket）
g callwarden-clients -

# 将 callwarden 加入 callwarden-clients 组
m callwarden callwarden-clients
