# Call Warden tmpfiles.d 配置（打包占位文件）
# Task: T-1783983162956-b2a8
# 设计 §8.2: systemd 创建 /run/callwarden，socket 0660
# 安装路径: /usr/lib/tmpfiles.d/callwarden.conf
# 由 systemd-tmpfiles --create 在启动时创建运行时目录。

# 运行时目录：属主 callwarden，属组 callwarden-clients
# socket 文件由 daemon 创建，UMask=0007 使其权限为 0660
d /run/callwarden 0755 callwarden callwarden-clients -
