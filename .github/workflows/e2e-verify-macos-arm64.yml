# P2-H Step 1: macOS arm64 artifact E2E 验证
# 设计文档：docs/design/rust-only-parser-cutover-plan.md §8 Phase 6
#
# 验证矩阵（设计 §8 Phase 6）：
#   | 平台  | 架构  | 角色        |
#   | macOS | arm64 | local/client |
#
# client/agent bundle 仅在 Linux 构建（spec sys.platform.startswith('linux')），
# 因此 macOS 只验证 local bundle 角色。
#
# 本 workflow 在干净的 macos-latest runner（Apple Silicon）上：
#   1. 构建 Rust 扩展 + PyInstaller 产物
#   2. 调用 .github/workflows/e2e/run_platform_e2e.py 执行 8 项验收检查
#   3. 上传 E2E 报告作为 artifact，供独立 Reviewer 复核
#
# 签名/notarization 前的 smoke 验证：本 workflow 不执行 codesign/notarization，
# 仅验证未签名产物的功能完整性。签名验证由 enterprise-release.yml Gate 7 执行。
#
# 触发：手动 workflow_dispatch、tag push (v*)、或 PR 改动 release/ 或 .github/workflows/e2e/
#
# 任务：T-1784986236714-ca26c424 Step 1
# 文件所有权：Release Validation Agent（不修改实现代码）

name: P2-H E2E macOS arm64

on:
  workflow_dispatch:
    inputs:
      skip_step5:
        description: '跳过 step5（全量 build + refresh + watcher）'
        type: boolean
        default: false
      skip_step7:
        description: '跳过 step7（schema upgrade/rollback）'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'
    paths:
      - '.github/workflows/e2e-verify-macos-arm64.yml'
      - '.github/workflows/e2e/**'
      - 'release/**'
      - 'pyproject.toml'
      - 'rust_ext/**'
      - 'cw.py'
      - 'callwarden/**'
      - 'db/**'
      - 'server/**'
      - 'cli/**'
      - 'parsers/**'
  pull_request:
    paths:
      - '.github/workflows/e2e-verify-macos-arm64.yml'
      - '.github/workflows/e2e/**'
      - 'release/**'

env:
  CARGO_TERM_COLOR: always
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: '1'

permissions:
  contents: read

concurrency:
  group: p2h-macos-arm64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos-arm64-e2e:
    name: macOS arm64 E2E (local bundle)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Build Rust extension
        run: python release/build.py --rust

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --prefer-binary --retries 5 --timeout 60 -r release/pyinstaller/requirements-build.txt
          python -m pip install . --no-deps
          # psutil 用于 step8 RSS 度量
          python -m pip install --prefer-binary --retries 5 --timeout 60 psutil

      - name: Run PyInstaller
        run: python -m PyInstaller release/pyinstaller/callwarden.spec --noconfirm --clean

      - name: Smoke-test frozen executables (pre-E2E, unsigned)
        run: |
          # 移除 quarantine 属性（runner 下载/构建的产物可能被 Gatekeeper 标记）
          xattr -cr dist/callwarden || true
          ./dist/callwarden/cw --version
          ./dist/callwarden/cw --help >/dev/null
          ./dist/callwarden/cw server --check-imports

      - name: Package artifact (tar.gz)
        run: |
          ARTIFACT="callwarden-macos-arm64.tar.gz"
          tar czf "$ARTIFACT" -C dist callwarden/
          echo "Artifact size: $(stat -f%z "$ARTIFACT") bytes"

      - name: Run E2E verification (8 steps)
        env:
          SKIP_STEP5: ${{ inputs.skip_step5 }}
          SKIP_STEP7: ${{ inputs.skip_step7 }}
        run: |
          EXTRA_ARGS=()
          if [ "$SKIP_STEP5" = "true" ]; then
            EXTRA_ARGS+=("--skip-step5")
          fi
          if [ "$SKIP_STEP7" = "true" ]; then
            EXTRA_ARGS+=("--skip-step7")
          fi

          python \
            .github/workflows/e2e/run_platform_e2e.py \
            --bundle dist/callwarden \
            --pyz-toc build/callwarden/PYZ-00.toc \
            --artifact callwarden-macos-arm64.tar.gz \
            --platform macos-arm64 \
            --role local \
            --report e2e-report-macos-arm64.json \
            "${EXTRA_ARGS[@]}"

          exit_code=$?
          echo "E2E exit code: $exit_code"
          if [ "$exit_code" -ne 0 ]; then
            echo "::warning::E2E 验证返回非零退出码 $exit_code，请检查 e2e-report-macos-arm64.json"
          fi

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-macos-arm64
          path: |
            e2e-report-macos-arm64.json
            callwarden-macos-arm64.tar.gz
            dist/callwarden/e2e-step2-macos-arm64-bundle-report.json
          retention-days: 30

      - name: Job summary
        if: always()
        continue-on-error: true
        run: |
          REPORT_PATH="e2e-report-macos-arm64.json"
          {
            echo "## P2-H macOS arm64 E2E 报告"
            if [ -f "$REPORT_PATH" ]; then
              python -c 'import json, pathlib; r=json.loads(pathlib.Path("e2e-report-macos-arm64.json").read_text(encoding="utf-8")); print("**Overall status**: " + str(r.get("overall_status", "unknown")))'
            else
              echo "P2-H macOS arm64 E2E 报告未生成"
            fi
          } >> "$GITHUB_STEP_SUMMARY" 2>&1 || true

  # Daemon 协同 E2E（Req 14.1, 14.3, 14.8, 14.22–14.26）
  daemon-collab-e2e:
    name: macOS arm64 Daemon Collab E2E
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust extension
        run: cd rust_ext && cargo build --release

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip --quiet
          pip install -r requirements.txt --quiet

      - name: Install LaunchAgent plist (Req 14.25)
        run: |
          mkdir -p ~/Library/LaunchAgents
          cat > ~/Library/LaunchAgents/com.callwarden.daemon.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>Label</key>
            <string>com.callwarden.daemon</string>
            <key>ProgramArguments</key>
            <array>
              <string>/usr/bin/python3</string>
              <string>${{ github.workspace }}/cw.py</string>
              <string>daemon</string>
              <string>serve</string>
            </array>
            <key>KeepAlive</key>
            <false/>
            <key>RunAtLoad</key>
            <false/>
          </dict>
          </plist>
          PLIST

      - name: Run daemon collaboration E2E
        run: |
          python .github/workflows/e2e/run_platform_e2e.py \
            --platform macos-arm64 \
            --report e2e-daemon-collab-macos-arm64.json \
            --daemon-collab

      - name: Upload daemon collab report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-daemon-collab-macos-arm64
          path: e2e-daemon-collab-macos-arm64.json
          retention-days: 14
