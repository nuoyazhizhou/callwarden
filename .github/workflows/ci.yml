name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust extension
        run: python release/build.py --rust

      - name: Clean build artifacts
        # 清理 dist/ build/ egg-info 防止旧缓存导致 wheel 包含已删除文件
        run: |
          rm -rf dist/ build/ *.egg-info
        shell: bash

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch：代码图谱工具不需要 CUDA，避免拉入 ~2GB nvidia 包
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install ".[all,dev]"
          pip install pytest-xdist pytest-timeout

      - name: Debug package structure
        run: |
          python -c "import callwarden; print('callwarden.__file__:', callwarden.__file__)"
          python -c "import callwarden.i18n; print('callwarden.i18n.__file__:', callwarden.i18n.__file__)"
          python -c "import callwarden.server; print('callwarden.server.__file__:', callwarden.server.__file__)"
          python -c "from callwarden.i18n import t; print('t imported OK')"

      - name: Run tests
        run: |
          pytest tests/ -n auto --tb=short --timeout=300 --timeout-method=thread

      - name: Build package
        run: |
          pip install build
          python -m build --wheel

      - name: Verify package install
        run: |
          pip install dist/*.whl --force-reinstall
          cw --help
          cw install --check

  lint:
    name: Lint check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run ruff
        run: ruff check . --exit-zero
        continue-on-error: true
