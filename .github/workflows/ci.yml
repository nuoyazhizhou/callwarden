name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
      # 契约/验收测试（如 tests/acceptance/inventory/cli/test_cli_tree.py 的
      # _is_ancestor）需 git 历史做 merge-base 祖先校验；shallow clone
      # （默认 fetch-depth=1）下任何非 HEAD 提交都不可达，断言必假性失败。
      # gitleaks job 同样因历史需求使用 fetch-depth: 0。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable

      - name: Install system libsqlite3 (v4 single-instance fix)
        # v4 WAL hazard 正式修法：ext 链系统 libsqlite3（与 Python 同进程共用
        # 同一 SQLite 实例）。ubuntu-latest(24.04) = sqlite 3.45.1 ≥ rusqlite
        # 0.31 基线 → build.py 走系统库分支（详见 release/build.py 注释）。
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Build Rust extension
        run: python release/build.py --rust

      - name: Build cw-daemon binary (H4C real-process gate)
        # H4C-1/2/3 真实进程门（test_http_combined_worker_cutover.py 4 个 +
        # test_http_compat_worker_batch.py 2 个）setup 用 pytest.fail（非 skip）
        # 要求 rust_ext/target/debug/cw-daemon 存在；test job 此前只建 --lib
        # 扩展，二进制缺席 → 6 ERROR。作者刻意选择 fail-loud 纪律，正解是构建
        # 二进制而非改 skip（改 skip 构成 MASKING）。debug profile 与门的
        # _find_daemon_binary 首选候选一致；compile-gate job 已实证
        # --no-default-features --bin 形态可建（本 step 不跑测试，仅构建）。
        run: cargo build --manifest-path rust_ext/Cargo.toml --no-default-features --features sqlite-bundled --bin cw-daemon

      - name: Create callwarden-clients group (P0-3 socket_group fail-closed)
        # w3 live daemon 测试（cli_084/085/086/cli01/cli02 共 20 个）的隔离
        # daemon 默认 socket_group='callwarden-clients'（daemon config.rs:178），
        # P0-3 v2 fail-closed：组不存在/chown 失败均拒绝启动（server.rs:316-378）。
        # CI runner 无此组 → daemon 启动末期退出（HTTP manifest 先发布→组检查
        # 失败→exit 1）→ 客户端 Connection reset。groupadd 是 daemon 错误消息
        # 自指引的生产安装步骤；usermod 让 runner 入组满足 chown 要求。
        run: |
          sudo groupadd -f callwarden-clients
          sudo usermod -a -G callwarden-clients runner

      - name: Install cw-daemon to runtime/current (release acceptance)
        # test_http_daemon_release_acceptance.py 的
        # test_runtime_current_daemon_exists 断言生产部署位
        # ~/.callwarden/runtime/current/cw-daemon（Linux 名无 .exe，与
        # daemon_autostart.py:608-612 平台分支一致）存在；CI fresh runner
        # 无 deb 部署 → 该位缺席 → run 12 失败。此 step 把上方 "Build
        # cw-daemon binary"（df092cf）的 debug 产物装到生产位，使分支在 CI
        # 有真实覆盖（存在性断言是 release acceptance 的核心，不改 skip）。
        # 二进制与 autostart _find_daemon_binary 的项目构建候选同源同内容，
        # 不改变其他测试的 daemon 解析行为。~ 在 GH Actions run: 展开为
        # /home/runner（bash 默认），显式写 $HOME 更稳。
        run: install -D rust_ext/target/debug/cw-daemon $HOME/.callwarden/runtime/current/cw-daemon

      - name: Clean build artifacts
        # 清理 dist/ build/ egg-info 防止旧缓存导致 wheel 包含已删除文件
        run: |
          rm -rf dist/ build/ *.egg-info
        shell: bash

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch：代码图谱工具不需要 CUDA，避免拉入 ~2GB nvidia 包
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install ".[all,dev]"
          pip install pytest-xdist pytest-timeout
          # CD-1：db/ 是仅测试支持层、不进 wheel，其模块级依赖 psutil 未随
          # extras 装入（CI Successfully installed 实测无 psutil），在此补装
          pip install psutil

      - name: Debug package structure
        run: |
          python -c "import callwarden; import os; p=callwarden.__path__[0]; print('dir:', p); print('contents:', sorted(os.listdir(p)))"
          python -c "import callwarden.i18n; print('i18n.__file__:', callwarden.i18n.__file__)"
          python -c "from callwarden.i18n import t; print('t OK')"

      - name: Debug xdist worker sys.path
        run: |
          cat > /tmp/test_debug_worker.py << 'PYEOF'
          def test_debug_worker():
              import sys, os
              print(f"\nsys.path: {sys.path}")
              try:
                  import callwarden
                  print(f"callwarden.__file__: {callwarden.__file__}")
                  print(f"callwarden.__path__: {list(callwarden.__path__)}")
                  for p in callwarden.__path__:
                      i18n_dir = os.path.join(p, 'i18n')
                      init_py = os.path.join(i18n_dir, '__init__.py')
                      print(f"  i18n in {p}: dir_exists={os.path.isdir(i18n_dir)}, init_exists={os.path.exists(init_py)}")
                  import callwarden.i18n
                  print(f"callwarden.i18n.__file__: {callwarden.i18n.__file__}")
                  print(f"has _load_lang: {hasattr(callwarden.i18n, '_load_lang')}")
              except Exception as e:
                  print(f"Error: {type(e).__name__}: {e}")
          PYEOF
          pytest /tmp/test_debug_worker.py -v -s -n 2

      # CD-1（CI-DEBT）：把仓库根以 callwarden 之名暴露为可导入，修 Linux
      # Python job collect 阶段 exit 4。根因：db/ 退休验收③（路线 B）降级 db/
      # 为仅测试支持层、不进生产 wheel（pyproject packages 无 callwarden.db，
      # purity 由 tests/convergence/test_db_retire_prod_purity.py 锁定），但
      # tests/conftest.py:5 import callwarden.db.db_base ⇒ wheel 无 db ⇒ 5 个
      # Linux job 全部 ModuleNotFoundError。对称 windows job（958db6b）：不
      # 重装包（两轮实证：semgrep 无 py3.14 wheel + PrebuiltBuildExt 校验预
      # 编译产物，皆否），用联接把仓库根挂成 <pkgroot>/callwarden 再进
      # PYTHONPATH，效果同可编辑安装、不触发 build_ext。用联接而非
      # 「PYTHONPATH 指父目录」：后者依赖检出目录名恰好为 callwarden，
      # fork/改名即静默失效。
      # 分阶段（R2）：本步只求 collect 越过 db 导入解析；run 阶段（daemon
      # 二进制可用性、平台差异、fixture 行为）是 Linux job 此前从未涉足的
      # 未知领域——「collect 绿 ≠ 问题解决」，run 失败须另卡。
      # i18n 双副本（R1）：db/ 的 3 处无点导入（from i18n import t）要求仓库
      # 根也在 sys.path，故 PYTHONPATH 一并含仓库根——此时 top-level i18n
      # 与 callwarden.i18n 是两个独立模块对象（本机实证 is 判定为 False）。
      # 既有代码缺陷，本步不预改；若 run 阶段因此失败再评估 db 3 处改相对
      # 导入（另批）。Debug 步骤（wheel 结构验证）刻意在本步之前执行，
      # 保持其验证已装 wheel 的语义不被源码树覆盖失焦。
      - name: Expose repo root as importable package (CD-1)
        shell: bash
        run: |
          pkgroot="$RUNNER_TEMP/cw_pkgroot"
          mkdir -p "$pkgroot"
          ln -sfn "$GITHUB_WORKSPACE" "$pkgroot/callwarden"
          # 自检：包必须解析到仓库根（run 3/4 无上下文失败的教训）
          PYTHONPATH="$pkgroot:$GITHUB_WORKSPACE" python -c "import callwarden, os; p=os.path.realpath(callwarden.__file__); print('callwarden ->', p); assert p.startswith(os.path.realpath('$GITHUB_WORKSPACE')), 'callwarden 未解析到仓库根: '+p"
          # 持久化到后续 step（Collect tests / Run tests / coverage gate）
          echo "PYTHONPATH=$pkgroot:$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Collect tests (fast import gate)
        run: |
          pytest tests/ --collect-only -q --tb=short --maxfail=1

      # tests/test_coverage_manifest.py 依赖 outputs/coverage_manifest.json（被
      # .gitignore 的生成产物）。CI 检出后无此文件 → module fixture fail →
      # 11 个测试全部 ERROR。于 pytest 前生成，产物由 scripts/ 纯 Python 生成、
      # 无 daemon 依赖（本地 gen 实测 cli_top=84/cli_leaf=198/mcp=243，与测试
      # 断言一致）。
      - name: Generate coverage manifest (test fixture dependency)
        run: python scripts/gen_coverage_manifest.py

      # known-red 隔离（T-3，docs/testing/known_red/）：把 kind=test 且
      # status=open 的 nodeid 从主门禁 deselect——主 job 的红此后只表示
      # 「本次改动引入的回归」；既有红由 known-red-quarantine job 单独如实报数，
      # 到期未关在该 job 红升级（当前三条目 KR-A/B/C 均 closed，deselect 为
      # 空串；机制保留供后续新登记使用）。schema 不合格时本步失败（exit 64），
      # 防半登记流入；deselect 参数与 -n auto 正交兼容。
      # set -euo pipefail 显式声明：命令替换赋值的退出码传播不得依赖
      # runner 默认 shell flag（verify 波实测：bash -e 下 rc=64 步失败、
      # 无 -e 则 SURVIVED 静默放行——与 C-2 fail-open 同型，故显式化）。
      - name: Compute known-red deselect args (T-3 isolation)
        run: |
          set -euo pipefail
          DESELECT_ARGS=$(python cicd/known_red.py --deselect)
          echo "DESELECT_ARGS=$DESELECT_ARGS" >> "$GITHUB_ENV"

      - name: Run tests
        if: matrix.python-version != '3.12'
        run: sg callwarden-clients -c "pytest tests/ -n auto --tb=short --maxfail=10 --timeout=300 --timeout-method=thread $DESELECT_ARGS"

      # 覆盖率门禁（任务5①）：只在 Python 3.12 单版本采集，避免矩阵 5 个版本
      # 产出 5 个不同覆盖率数字（各版本 skip 情况不同）。阈值取自 pyproject.toml
      # [tool.coverage.report] fail_under；source 范围取 [tool.coverage.run] source
      # （cli/server/cw.py/config.py 核心生产面）。--cov 走配置文件 source，
      # 不在 addopts 里（本机无 pytest-cov 会让所有 pytest 调用崩）。
      - name: Run tests (coverage gate)
        if: matrix.python-version == '3.12'
        run: >-
          sg callwarden-clients -c "pytest tests/ -n auto --tb=short --maxfail=10 --timeout=300 --timeout-method=thread --cov --cov-report=term-missing --cov-report=xml:coverage.xml $DESELECT_ARGS"

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: coverage-python
          path: coverage.xml
          if-no-files-found: warn

      - name: Build package
        run: |
          pip install build
          python -m build --wheel

      - name: Verify package install
        run: |
          pip install dist/*.whl --force-reinstall
          cw --help
          cw install --check

  # ============================================================
  # known-red 隔离 quarantine job（T-3，2026-10-24）
  #
  # 主 test job 经 cicd/known_red.py --deselect 把 open 状态的
  # known-red nodeid 移出主门禁——主 job 的红此后只表示「本次改动引入的回归」。
  # 被隔离的既有红不得凭空消失：本 job 单独如实跑这些 nodeid
  # （--quarantine-list 取清单，不加 -n auto：单进程排除 xdist 干扰），
  # 结论如实反映（当前三条目全 closed ⇒ 清单为空，本步直接通过）。
  #
  # 为何 KR 未修期间允许本 job 红：红 = KR 仍未修复，这正是隔离的预期
  # 状态——把「已知的红」与「未知的回归」分开计价，恢复红灯的信号意义
  # （红灯疲劳比没有门禁更危险）。故不设 continue-on-error、不吞退出码；
  # 同时它不阻塞主门禁结论。它绿 = KR 已实际修复 ⇒ 必须立刻走
  # docs/testing/known_red/README.md 的关闭流程（改 status=closed、
  # nodeid 自动退出 deselect），否则构成「修了不关」的假账。
  #
  # 到期升级：末尾校验步对 open 条目做到期检查，过期 ⇒ exit 2 ⇒ 本步红，
  # 在「用例红」之外给出明确的「条目过期」失败，逼迫治理决策
  # （加速修复 / 重估根因 / 显式修订到期日），红不被容忍成永久背景噪声。
  # kind=workflow 条目（KR-C）非 pytest nodeid，不进本 job 跑，仅由该校
  # 验步做到期跟踪。
  #
  # 环境搭建镜像主 test job：隔离 daemon（w3 harness / HttpDaemonRpcClient
  # 实跑）要求 debug cw-daemon 二进制（主 job H4C step 同款构建）与
  # callwarden-clients 组（P0-3 socket_group fail-closed），PYTHONPATH
  # 走 CD-1 联接。不装 torch 的 CUDA 变体（CPU-only，同主 job 理由）。
  # ============================================================
  known-red-quarantine:
    name: Known-red quarantine (isolated reds, honest reporting)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.13'
          allow-prereleases: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable

      - name: Install system libsqlite3 (v4 single-instance fix)
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Build Rust extension
        run: python release/build.py --rust

      - name: Build cw-daemon binary (isolated daemon requirement)
        # w3 harness 的 find_daemon_binary 首选 rust_ext/target/debug/
        # cw-daemon；release/build.py --rust 只建扩展（--lib --release），
        # 二进制须本 step 单独构建（与主 test job H4C step 同款）。
        run: cargo build --manifest-path rust_ext/Cargo.toml --no-default-features --features sqlite-bundled --bin cw-daemon

      - name: Create callwarden-clients group (P0-3 socket_group fail-closed)
        # 隔离 daemon 默认 socket_group='callwarden-clients'，v2 fail-closed：
        # 组不存在/chown 失败均拒绝启动。groupadd + usermod + 下方 sg 包裹
        # 三件套与主 test job 同构（usermod 的组变更只对后续 sg 新会话生效）。
        run: |
          sudo groupadd -f callwarden-clients
          sudo usermod -a -G callwarden-clients runner

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch：避免拉入 ~2GB nvidia 包（同主 test job 理由）
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install ".[all,dev]"
          pip install pytest-xdist pytest-timeout
          # CD-1：db/ 仅测试支持层，模块级依赖 psutil 未随 extras 装入
          pip install psutil

      # CD-1：仓库根以 callwarden 之名暴露（与主 test job 同形，保证导入解析一致）
      - name: Expose repo root as importable package (CD-1)
        shell: bash
        run: |
          pkgroot="$RUNNER_TEMP/cw_pkgroot"
          mkdir -p "$pkgroot"
          ln -sfn "$GITHUB_WORKSPACE" "$pkgroot/callwarden"
          PYTHONPATH="$pkgroot:$GITHUB_WORKSPACE" python -c "import callwarden, os; p=os.path.realpath(callwarden.__file__); assert p.startswith(os.path.realpath('$GITHUB_WORKSPACE')), 'callwarden 未解析到仓库根: '+p"
          echo "PYTHONPATH=$pkgroot:$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Run known-red quarantine tests (honest red allowed)
        # KR 未修期间允许红=隔离的预期状态（见 job 头注释）；不吞退出码。
        # sg 包裹使 runner 入 callwarden-clients 组（P0-3 chown 要求）。
        # nodeid 必须先拼成单行：command substitution 若把文件里的换行原样带进
        # `sh -c`，每行会被当成独立命令执行，9 个 nodeid 只有第 1 个真正跑了，
        # 其余报 "No such file or directory" 并以 127 退出（实证 run 40155571488）。
        run: |
          python cicd/known_red.py --quarantine-list > /tmp/quarantine_nodeids.txt
          if [ ! -s /tmp/quarantine_nodeids.txt ]; then
            echo "no open known-red test entries; nothing to quarantine"
            exit 0
          fi
          echo "===== quarantine nodeids ($(wc -l < /tmp/quarantine_nodeids.txt)) ====="
          cat /tmp/quarantine_nodeids.txt
          nodeids="$(tr '\n' ' ' < /tmp/quarantine_nodeids.txt)"
          # shellcheck disable=SC2086 —— nodeid 无空格/通配符，词split安全；无 -n auto 单进程如实报数
          sg callwarden-clients -c "pytest $nodeids -q --tb=short --timeout=300 --timeout-method=thread"

      - name: Known-red registry validation + expiry gate
        # 到期未关 ⇒ exit 2（kind=workflow 条目同样参与到期跟踪）。
        # always()：pytest 步已红时也照常跑，给出独立的「条目过期」信号。
        if: always()
        run: python cicd/known_red.py

  # ============================================================
  # malformed 族回归门（原 CI-DEBT 深水区 A/B 定性 probe，2026-10-23 收敛）
  #
  # 历史根因：同进程双 SQLite 实例（Python 侧系统 libsqlite3 + Rust 侧
  # rusqlite bundled）在 Linux 上 fcntl 锁按进程分配、两实例无法互斥 WAL
  # ⇒ 撕裂页（`database disk image is malformed`）。v1/v2/v3 三代修法始终
  # 无法让 h7 与 p15 两族同时绿，最终由 v4「同进程单一 libsqlite3 实例」
  # 根治（ext 在 Linux 上链接系统 sqlite3，与 Python sqlite3 模块同一 .so）。
  # 完整取证链见 docs/testing/ci_malformed_bisect_evidence.md。
  #
  # 本 job 定性取证的使命已完成，故删除全部 A/B 诊断臂
  # （Probe A/B/C/D/E/G/H/I/J）及其依赖的临时探针插件，只保留下面这一个
  # **逐文件隔离回归门**：单进程（无 xdist）隔离跑历史上最脆弱的 9 个文件，
  # 覆盖主测试 job 的 xdist 条件所不覆盖的场景。
  # ============================================================
  wal-ab-probe:
    name: WAL malformed regression gate (isolated)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          allow-prereleases: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Install system libsqlite3 (v4 single-instance fix)
        # 同主测试 job：ext 走系统 libsqlite3 分支需要 dev 头。
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Build Rust extension
        run: python release/build.py --rust

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install ".[all,dev]"
          pip install pytest-xdist pytest-timeout
          pip install psutil

      # CD-1：仓库根以 callwarden 之名暴露（与 test job 同形，保证导入解析一致）
      - name: Expose repo root as importable package (CD-1)
        shell: bash
        run: |
          pkgroot="$RUNNER_TEMP/cw_pkgroot"
          mkdir -p "$pkgroot"
          ln -sfn "$GITHUB_WORKSPACE" "$pkgroot/callwarden"
          echo "PYTHONPATH=$pkgroot:$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      # malformed 族隔离回归门：逐文件隔离单跑（无 xdist）历史上最脆弱的
      # 9 个文件——h7 族 4 个 + p15 族 3 个 + incremental_parse + dashboard。
      # 判读：输出中**不得**再出现 "database disk image is malformed"；
      # 出现即判回归，本 step 直接失败。
      #
      # 门设计注意：本 job 默认 `set -e`，`out=$(pytest ...)` 任何**非
      # malformed** 的测试失败也会直接退出且吞掉 tail 输出——必须 `|| true`
      # 保住诊断输出（b8b05ec run 中本门即在首个文件 h7 上被 set -e 吞输出）。
      - name: malformed family isolation gate
        if: always()
        run: |
          for f in tests/test_h7_ast_cache_activation.py tests/test_agent_rules.py \
                   tests/test_agent_integration.py tests/test_e2e_triangle_demo.py \
                   tests/test_p15_lang_presort.py tests/test_p15_multiprocess_parse.py \
                   tests/test_p15_lazy_import_and_dyn_workers.py tests/test_incremental_parse.py \
                   tests/test_dashboard.py; do
            echo "===== ISOLATED: $f ====="
            out=$(pytest "$f" -q --tb=short -p no:cacheprovider 2>&1) || true
            echo "$out" | tail -15
            if echo "$out" | grep -q "database disk image is malformed"; then
              echo "MALFORM REGRESSION in $f"
              exit 1
            fi
          done

  # ============================================================
  # macOS 收口守卫（2026-10-23，取代原 wal-malformed-gate-macos 裁决门）
  #
  # 背景（一句话）：macOS 上 Python 的 SQLite 静态编译进 _sqlite3.so，
  # Rust 扩展在 macOS 只能 bundled（release/build.py 平台门只在 Linux 切
  # 系统库）=> 同进程两个 SQLite 实例共享 -wal/-shm => malformed 撕裂面
  # 已由 CI run 39923719831 实证坐实，且切系统库路径被 F1/F3 取证证明
  # 结构性不可行（Python 侧无可共用的共享 libsqlite3）。产品裁决 =
  # 收口 macOS 支持（详见 docs/testing/ci_malformed_bisect_evidence.md
  # 十三/十四节）。
  #
  # 本 job 的职责：守卫收口事实——.github/workflows/ 全域不得再出现
  # macOS runner（latest 及 1x 系列）。本仓 macOS matrix 项历史上被反复
  # 加回（P0-3 整改、release.yml、pyinstaller-build.yml、
  # enterprise-release 两处 matrix），无守卫则收口会被无声侵蚀。
  #
  #  needle 用字符串拼接（"macos""-latest"）使本文件自身不匹配该模式。
  # ============================================================
  no-macos-artifacts-guard:
    name: macOS retirement guard (no macOS runner in any workflow)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Assert no macOS runner anywhere in .github/workflows
        run: |
          needle="macos""-latest|macos-1[0-9]"
          hits=$(grep -rEn "$needle" .github/workflows/ || true)
          if [ -n "$hits" ]; then
            echo "::error::macOS 支持已收口（裁决与证据：docs/testing/ci_malformed_bisect_evidence.md 十三/十四节），但 .github/workflows/ 仍出现 macOS runner："
            echo "$hits"
            exit 1
          fi
          echo "OK: no macOS runner in .github/workflows/ (macOS retired 2026-10-23)"

  lint:
    name: Lint check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      # P1 修复（2026-10-13 安全域审查）：--exit-zero + continue-on-error 使 ruff
      # 形同虚设（永远不红）。改为阻断式门禁。
      - name: Run ruff
        run: ruff check .

  # ============================================================
  # 安全门禁（2026-10-13 安全域审查问题 ⑪⑫ 补齐）：
  # 此前 PR CI 零安全扫描——SAST/SCA/secret-scan 全部缺失，依赖漏洞扫描仅
  # release 时且只 high（enterprise-release.yml Gate 8），PR 侧无任何拦截。
  # 本 job 补：bandit(SAST) + semgrep(SAST,secrets/ci 规则) + pip-audit(SCA)
  # + cargo-audit(SCA/Rust) + gitleaks(secret-scan)，全部阻断式。
  # ============================================================
  security:
    name: Security gates (SAST / SCA / secret-scan)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          # gitleaks 需要完整历史做 commit 扫描
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable

      # --- SAST: bandit（Python 静态分析，medium+ 阻断）---
      # 范围覆盖核心生产面与生产 SQL/XML 层：cli/（CLI 84 命令入口）+
      # server/（MCP 243 工具 + daemon client + autostart）+ 根入口
      # cw.py/config.py + db/（生产 SQL 层）+ scripts/（运维脚本）。
      # T-6/GAP-SEC-02（2026-10-26）：db/ 与 scripts/ 原有 68 条 medium+ 已
      # 逐条处置——B314×7 改用 defusedxml、B602×1 改 shell=False、B324×1 加
      # usedforsecurity=False、B608×59 逐行 `# nosec B608` 登记理由（均为
      # ? 占位符或代码内常量片段）。新增未登记 finding 立即阻断。
      - name: Install bandit
        run: pip install bandit[toml]
      - name: Run bandit (medium+ blocks)
        run: bandit -r cli server db scripts cw.py config.py -ll

      # --- SAST: semgrep（secrets + ci 规则集，error 级阻断）---
      # Windows runner 装不了 semgrep（见 e2e-verify-windows-amd64.yml），
      # 故只在 Linux CI 跑；开发者侧 `cw security scan` 保留 p/default。
      - name: Install semgrep
        run: pip install semgrep
      - name: Run semgrep (secrets + ci rules, errors block)
        # --timeout：每规则每文件的超时秒数（默认仅 5s）。基线 run
        # 38933176545 有 2 处规则超时 warning（cli/main.py、db/db_stdlib.py
        # 的 python.boto3.security.hardcoded-token）——超时的规则不报错也不
        # 出 finding，构成扫描盲区，提超时到 60s 去盲。
        run: semgrep scan --config p/secrets --config p/ci --error --timeout 60

      # --- SCA: pip-audit（依赖漏洞，high+critical 阻断）---
      # 与 enterprise-release.yml Gate 8 同款 severity 过滤逻辑
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Run pip-audit (high+critical blocks)
        run: |
          pip-audit -r requirements.txt -o vuln-audit.json --format=json || true
          HIGH_VULNS=$(python -c "import json; d=json.load(open('vuln-audit.json')); print(len([v for v in d.get('dependencies',[]) if any(f.get('severity','').lower() in ('high','critical') for f in v.get('vulns',[]))]))")
          if [ "$HIGH_VULNS" -gt "0" ]; then
            echo "FAIL: $HIGH_VULNS high/critical-severity vulnerabilities found"
            cat vuln-audit.json
            exit 1
          fi
          echo "OK: No high/critical-severity vulnerabilities"

      # --- SCA: cargo-audit（Rust 依赖漏洞，任何已知漏洞阻断）---
      # 版本锁：cargo install 默认取最新发布版，CLI 会随版本漂移（v0.22.2 的
      # usage 是 `cargo audit [OPTIONS] [COMMAND]`，无 --manifest-path；本步骤
      # 此前因 --manifest-path 被 v0.22.2 拒绝 exit 2）。锁 0.22.2 = 已验证
      # --file 可用的版本；升级须改此版本号并重跑本 job 验证。
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2
      # --file 指向已提交的 rust_ext/Cargo.lock（cargo-audit 只接受 lockfile
      # 路径：v0.22.2 src/commands/audit.rs 的 -f/--file，
      # help="Cargo lockfile to inspect"）。
      - name: Run cargo-audit (Rust deps)
        run: cargo audit --file rust_ext/Cargo.lock

      # --- secret-scan: gitleaks（全历史提交扫描）---
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz \
            | tar xz -C /usr/local/bin gitleaks
      - name: Run gitleaks (repo history + working tree)
        # 272 findings 实证全部为假阳性（token_hash 单向哈希产物 + 脱密功能
        # 测试夹具，triage 见 .gitleaks.toml 文件头注释；semgrep p/secrets
        # 交叉验证 0 finding）。gitleaks v8.18.4 不会自动发现源目录的
        # .gitleaks.toml，必须显式 --config；默认规则集经 useDefault=true
        # 全量保留，真实泄漏仍被捕获。
        run: gitleaks detect --source . --config .gitleaks.toml --redact

  # 🔴 TP-11G 实测（2026-10-14，Windows 本机）：把 ci.yml 原样命令拿来跑是
  # **EXIT=101 编译失败**（`daemon/fs_handlers.rs` 的 parse_and_store_symbols
  # 生产侧 7 参 / `#[cfg(test)]` 调用点 4 参，E0061 ×3）。过滤器
  # `daemon::compat_native_handlers` **只过滤运行、不过滤编译** → 整个 lib
  # test 二进制编不出来，Rust 层 CI 有效信号长期为 **0**（不是 6/2073）。
  # 更糟的是它红在「编译失败」，极易被误读成「那 6 个测试有问题」。
  # 故新增本 job 把编译失败顶到最前面、单独成门禁。
  rust-compile-gate:
    name: Rust test binaries compile gate (fail-fast)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.14'
          allow-prereleases: true
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
      - name: Compile all test binaries (lib + tests + bins, no run)
        # 只编译不运行：把 E0061 这类「生产签名改了但测试调用点没同步」的
        # 错误在最便宜的地方暴露出来。
        run: >-
          cargo test --manifest-path rust_ext/Cargo.toml
          --no-default-features --features sqlite-bundled --lib --tests --bins --no-run

  rust-unit-test:
    # T7 跨平台审查发现：此前所有 workflow 只 cargo build、从不 cargo test，
    # Rust daemon 单元测试（如 daemon::compat_native_handlers 的 gc_restore 全扫 /
    # gc_purge 审计 / build_defect_knowledge fixes 关联逻辑）在 CI 完全无覆盖，
    # Rust 层逻辑回归 CI 抓不到（违背 AGENTS 规则 24）。本 job 补上 cargo test。
    #
    # 现范围（TP-11G 扩面后）= 既有 compat_native_handlers + 五目标模块，
    # 见下方过滤器。历史勘误：曾仅跑 compat_native_handlers，理由是
    # 「snapshot_state 等依赖进程单例/真实环境，daemon:: 全模块并行跑会挂起」
    # ——该挂起声明经 TP-11G 实测**为误**（勘误依据见下「🔴」段），故未作为
    # 本 job 维持窄过滤器的依据；实际未扩到全 --lib 的原因是下述三项前置
    # 条件（1/2 已解除，3 由本 job 实证裁决）。
    #
    # 🔴 以上「并行跑会挂起」经 TP-11G 实测**是反的**：
    #   cargo test --no-default-features --lib（默认并行，= 删掉过滤器）
    #   → 1905 passed / 10 failed / 1327.86s（22.1 分钟）**不挂死**；
    #   而 `daemon::workspace`(147) 与 `daemon::snapshot_state`(58) 串行
    #   900s 只分别跑完 27 / 17 个 → **串行才是跑不完的原因**。
    #   故扩面时 CI **不应加 --test-threads=1**。
    #
    # TP-11G 扩面前置条件（原 3 项）状态：
    #   1. ✅ 4 个平台无关确定性缺陷（裸 CREATE TABLE）已修复：
    #      1854255（cli/refresh.rs 冗余夹具 batch 删除 + cas_merge.rs 4 列桩
    #      删除/INSERT 补齐 11 列）+ 223d89a（夹具 root_path 归一化，
    #      何序定位 + 主理人调试实证：夹具存原始路径致生产归一化匹配
    #      不上另起新行，file_instances 全写 ws=2）。
    #   2. ✅ 4 个非密闭用例（cli/router.rs is_daemon_available windows 分支
    #      忽略 socket_path）已修复：a805db5（三分支判定 + 超时 5000）+
    #      8694e17（大小写不敏感 + 分支 1 真实管道注入测试）+ d31efce。
    #   3. ⏳ 2 个 golden（daemon::task_prompt::bundle_tests）漂移：
    #      Windows 实机红，Linux 预期绿（归一化恒等推断）。
    #      **本 job 纳入 bundle_tests 即是该项的 Linux 实证复核**：
    #      绿 → 桶 ③ 清零；红 → **必须根因修复**（大概率是跨平台归一化
    #      行为分歧，与 F-ROUTER-01 同类的路径语义问题），
    #      **禁止改期望文件去匹配实际输出**（关屿口径：那是 MASKING，
    #      与本仓 468 条 skip 中 28 条同款坏味道）。
    # Windows 平台 job 见 rust-unit-test-windows（不含 bundle_tests——
    # golden 漂移在 Windows 已知红，不得把已知红烘进 CI）。
    name: Rust unit tests (TP-11G target modules)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.14'
          allow-prereleases: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable

      - name: Create callwarden-clients group (daemon_e2e socket_group fail-closed)
        # daemon_e2e 启动真实 cw-daemon 子进程，默认 socket_group='callwarden-clients'
        # （daemon/config.rs 默认值）；P0-3 v2 fail-closed：组不存在/chown 失败拒绝
        # 启动 → socket 永不就绪。三件套（groupadd + usermod + 下方 sg 包裹）与主
        # test job 同构（usermod 的组变更只对后续 sg 新会话生效）。
        run: |
          sudo groupadd -f callwarden-clients
          sudo usermod -a -G callwarden-clients runner

      - name: Run Rust daemon unit tests (TP-11G target set)
        # --no-default-features 关闭 extension-module，让 PyO3 链接 libpython
        # （Cargo.toml [features] 注释明确此为测试模式）。setup-python 提供 libpython。
        # 过滤器 = 既有 compat_native_handlers + TP-11G 五目标模块。
        # 多过滤器必须放 `--` 之后（libtest 对多个位置参数做 OR 匹配）。
        # 注意 cfg(windows) 测试（router 管道注入 2 例）在 Linux 不编译，不计 skip。
        run: >-
          cargo test --manifest-path rust_ext/Cargo.toml
          --no-default-features --features sqlite-bundled --lib --
          daemon::compat_native_handlers
          cli::router cli::runtime cli::refresh
          daemon::cas_merge daemon::task_prompt::bundle_tests

      - name: Run Rust integration tests (rust_ext/tests)
        # T-7（full_stack_review 条件 6）：rust_ext/tests/ 此前只在
        # rust-compile-gate 里 `--no-run` 编译，三个执行 job 全是 `--lib` +
        # 模块过滤——「存在但从不执行」，kill -9 恢复链 / SIGTERM / 角色提示
        # 资产门在 CI 无任何防线。本 step 逐个 `--test` 真实执行全部集成目标：
        #   - daemon_e2e：真 cw-daemon 子进程 + UDS 全 RPC（Unix-only，8 例）
        #   - p1_f_recovery_e2e：kill -9 恢复链（15 例）
        #   - role_prompt_assets_golden：生产资产 sha256 门（4 例）
        #   - role_prompt_e2e / validator positive+negative / test_external_cli
        # 不用 `--tests`：该选项同时选中 lib target（1905 例，含已知红
        # bundle_tests，22 分钟），会把本 job 变成全量 lib 重跑。
        # CARGO_BIN_EXE_cw-daemon 由 cargo test 自动注入；sg 包裹让 runner
        # 以 callwarden-clients 为组身份满足 socket chown 要求。
        run: |
          sg callwarden-clients -c "cargo test --manifest-path rust_ext/Cargo.toml \
            --no-default-features --features sqlite-bundled \
            --test daemon_e2e --test p1_f_recovery_e2e \
            --test role_prompt_assets_golden --test role_prompt_e2e \
            --test role_prompt_validator_negative \
            --test role_prompt_validator_positive --test test_external_cli"

  rust-unit-test-windows:
    # F-CI-01（关屿 / TP-11G #49）：Windows 安全关键路径此前 CI 零覆盖
    # ——所有 job 都在 ubuntu 上，named pipe 传输（SDDL 安全描述符、
    # SID 派生）、is_daemon_available 的 windows 分支（TP-11G #48 刚修复
    # 的 fail-closed 缺陷）等平台关键代码的回归只有开发者本机可见。
    #
    # 范围（安全关键路径，Windows 实机实测全绿）：
    #   - daemon::transport_windows  管道 SDDL / SID / peer identity（7 例）
    #   - daemon::peercred           授权身份根（ImpersonateNamedPipeClient
    #                                取对端 SID → workspace owner ACL 输入；
    #                                P1 补选，关屿复核：回归即全越权校验
    #                                输入错误，8 例）
    #   - cli::router                路由决策 + is_daemon_available 三分支
    #                                （含分支 1 真实管道注入测试 2 例，26 例）
    #   - cli::runtime               可用性注入式判定（密闭，真分支 3）
    #   - cli::refresh               刷新/回滚（夹具已按生产契约归一化）
    #   - daemon::cas_merge          CAS 合并（INSERT 已补齐生产 11 列）
    # 合计 83 例（Windows 本机预演 83 passed / 0 failed）。
    #
    # 不含 daemon::task_prompt::bundle_tests：golden 漂移在 Windows 已知红
    # （待 Linux 复核桶，见 rust-unit-test 注记）——把已知红烘进 CI 只会
    # 让信号失真，不作为本 job 范围。
    # daemon::workspace（147 例重夹具，本地实测大量单测 >60s）拆到
    # rust-unit-test-windows-workspace，避免拖慢本 job 的安全回归反馈。
    #
    # timeout 45min：windows-latest 冷构建（tree-sitter/numpy 等）显著慢于
    # ubuntu（本地 MSVC 隔离冷构建 ~950s ≈ 16min），本集测试本体 ~1min；
    # 若首跑超时，优先加 Rust 构建缓存而非继续加 timeout（关屿口径）。
    name: Rust unit tests (Windows security-critical paths)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.14'
          allow-prereleases: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable

      - name: Run Rust unit tests (security-critical, Windows)
        run: >-
          cargo test --manifest-path rust_ext/Cargo.toml
          --no-default-features --features sqlite-bundled --lib --
          daemon::transport_windows daemon::peercred
          cli::router cli::runtime cli::refresh
          daemon::cas_merge daemon::client

      - name: Run Python false-positive probe + D5 creator crosscheck tests (TP-49/2a 反证用例)
        # F-CI-01 延伸（关屿验收）：假阳性卡的全部价值压在这两条反证
        # 用例上，而 windows job 此前只跑 cargo——pytest 用例存在但从不
        # 执行（与「测试存在但从不执行」同款缺口）。变体 1/2 均 win32
        # 限定，ubuntu job 全 skip，故放 windows job 守护。
        # 2a 层 4（D5）：归属交叉校验用例同守护（诚实 pid 通过 / 失配
        # fail-closed / 查询不可得放行 / D3.3 端点参数化）。
        # faulthandler_timeout=90：若探针路径死锁（回归），60/90s 转储
        # 全线程栈定位而非静默挂满 timeout。
        #
        # ---------------- 为什么不能 `pip install -e .`（两轮 CI 实证） ----------------
        # run 4（38752482872）：`pip install -e .` 解析 pyproject 的
        #   dependencies（含 semgrep>=1.50），windows-latest + Python 3.14 无
        #   可用 wheel → sdist 构建失败：
        #     ERROR: Failed to build 'semgrep' when getting requirements to build wheel
        #   → 包没装上 → No module named 'callwarden'。
        # run 5（38758644068）：改 `--no-deps` 绕开 semgrep 后，撞上第二个
        #   硬阻塞——PrebuiltBuildExt（setup.py:68）校验预编译产物存在：
        #     error: 预编译二进制不存在: D:\a\callwarden\callwarden\callwarden_core.pyd
        #   全新检出没有该产物（本地仓库有历史构建产物，故本地装得上也跑得通，
        #   这正是「本地实证通过 ≠ CI 能过」的陷阱）。与 --no-deps 无关，
        #   即 **本 job 不能装包**。
        #
        # ---------------- 替代方案：不装包，让仓库根以 callwarden 之名可导入 ----------------
        # setup.py 把**仓库根**映射为 callwarden 包（package_dir，
        # egg-info top_level.txt = callwarden/callwarden_core）。这里用目录
        # 联接把仓库根挂成 <pkgroot>/callwarden 再进 PYTHONPATH，效果等同
        # 于可编辑安装，且不触发 build_ext。
        # 用联接而非「PYTHONPATH 指向检出目录的父目录」：后者依赖检出目录
        # 名恰好是 callwarden，fork/改名即静默失效。
        #
        # 依赖安全性已逐条核验（非推断）：两个用例的导入链只触及
        # callwarden.config / db.db_base / server.daemon_client，模块级导入
        # 全为 stdlib + 包内；第三方仅 pathspec（analyzers/ignore_spec.py 的
        # try/except ImportError 内，可降级）与 defusedxml（db/db_coverage.py
        # 模块级导入，T-6/GAP-SEC-02 起用于替代 xml.etree，纯 Python 无编译，
        # 故显式 pip 安装；不装包的前提不变）。
        # 本机干净 venv（pytest + defusedxml，不装包）+ 本联接方案实证：7 passed。
        shell: pwsh
        run: |
          python -m pip install pytest defusedxml
          $pkgroot = Join-Path $env:RUNNER_TEMP 'cw_pkgroot'
          New-Item -ItemType Directory -Force -Path $pkgroot | Out-Null
          $link = Join-Path $pkgroot 'callwarden'
          if (-not (Test-Path $link)) {
            New-Item -ItemType Junction -Path $link -Target $env:GITHUB_WORKSPACE | Out-Null
          }
          $env:PYTHONPATH = $pkgroot
          # 自检：包必须解析到仓库根，否则下面的 ModuleNotFoundError 又会
          # 变成一处无上下文的失败（run 3/4 的教训）。
          # 必须 realpath：联接下 __file__ 是 <pkgroot>\callwarden\__init__.py，
          # 只有解析联接后才是 GITHUB_WORKSPACE 下的真实路径（本地实测）。
          python -c "import callwarden, os; p=os.path.realpath(callwarden.__file__); print('callwarden ->', p); assert p.startswith(os.path.realpath(os.environ['GITHUB_WORKSPACE'])), 'callwarden 未解析到仓库根: '+p"
          python -u -m pytest tests/test_tp49_false_positive_probe.py tests/test_tp11g_d5_creator_crosscheck.py -q -o faulthandler_timeout=90

  rust-unit-test-windows-workspace:
    # P2 补选（关屿复核）：daemon::workspace 的 Windows 身份归一化测试
    # （verbatim 前缀剥离 / 盘符大小写收敛 / CR7 前分裂行）是 owner ACL
    # 匹配的前提——若路径拼写产生分裂身份，owner ACL 作用域即失效，与
    # golden 桶的归一化恒等推断同根，Windows 实机验证价值高。
    #
    # 独立成 job 的原因：daemon::workspace 147 例为重夹具测试，本地实测
    # 865s（含 peercred），其中 82 例单测 >60s；windows-latest CPU 更少
    # 更慢，测试时长预计 2-4 倍膨胀，与快集合跑会拖慢安全回归反馈。
    #
    # timeout 90min：冷构建 ~16-48min + 测试 28-58min（估算），留余量；
    # 若超时先加 Rust 构建缓存再评估拆分。
    name: Rust unit tests (workspace, Windows)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.14'
          allow-prereleases: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable

      - name: Run Rust unit tests (workspace identity normalization, Windows)
        run: >-
          cargo test --manifest-path rust_ext/Cargo.toml
          --no-default-features --features sqlite-bundled --lib -- daemon::workspace
