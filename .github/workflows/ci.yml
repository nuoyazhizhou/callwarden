name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust extension
        run: python release/build.py --rust

      - name: Clean build artifacts
        # 清理 dist/ build/ egg-info 防止旧缓存导致 wheel 包含已删除文件
        run: |
          rm -rf dist/ build/ *.egg-info
        shell: bash

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch：代码图谱工具不需要 CUDA，避免拉入 ~2GB nvidia 包
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install ".[all,dev]"
          pip install pytest-xdist pytest-timeout

      - name: Debug package structure
        run: |
          python -c "import callwarden; import os; p=callwarden.__path__[0]; print('dir:', p); print('contents:', sorted(os.listdir(p)))"
          python -c "import callwarden.i18n; print('i18n.__file__:', callwarden.i18n.__file__)"
          python -c "from callwarden.i18n import t; print('t OK')"

      - name: Debug xdist worker sys.path
        run: |
          cat > /tmp/test_debug_worker.py << 'PYEOF'
          def test_debug_worker():
              import sys, os
              print(f"\nsys.path: {sys.path}")
              try:
                  import callwarden
                  print(f"callwarden.__file__: {callwarden.__file__}")
                  print(f"callwarden.__path__: {list(callwarden.__path__)}")
                  for p in callwarden.__path__:
                      i18n_dir = os.path.join(p, 'i18n')
                      init_py = os.path.join(i18n_dir, '__init__.py')
                      print(f"  i18n in {p}: dir_exists={os.path.isdir(i18n_dir)}, init_exists={os.path.exists(init_py)}")
                  import callwarden.i18n
                  print(f"callwarden.i18n.__file__: {callwarden.i18n.__file__}")
                  print(f"has _load_lang: {hasattr(callwarden.i18n, '_load_lang')}")
              except Exception as e:
                  print(f"Error: {type(e).__name__}: {e}")
          PYEOF
          pytest /tmp/test_debug_worker.py -v -s -n 2

      - name: Collect tests (fast import gate)
        run: |
          pytest tests/ --collect-only -q --tb=short --maxfail=1

      - name: Run tests
        run: |
          pytest tests/ -n auto --tb=short --maxfail=10 --timeout=300 --timeout-method=thread

      - name: Build package
        run: |
          pip install build
          python -m build --wheel

      - name: Verify package install
        run: |
          pip install dist/*.whl --force-reinstall
          cw --help
          cw install --check

  lint:
    name: Lint check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run ruff
        run: ruff check . --exit-zero
        continue-on-error: true

  rust-unit-test:
    # T7 跨平台审查发现：此前所有 workflow 只 cargo build、从不 cargo test，
    # Rust daemon 单元测试（如 daemon::compat_native_handlers 的 gc_restore 全扫 /
    # gc_purge 审计 / build_defect_knowledge fixes 关联逻辑）在 CI 完全无覆盖，
    # Rust 层逻辑回归 CI 抓不到（违背 AGENTS 规则 24）。本 job 补上 cargo test。
    #
    # 范围限定 daemon::compat_native_handlers：这些测试用 in-memory SQLite、
    # 无环境依赖、稳定可重复。未纳入 daemon:: 全模块是因为 snapshot_state 等
    # 既有测试依赖进程单例/真实环境，并行跑会挂起（既有问题，另行治理）。
    name: Rust unit tests (daemon compat handlers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          allow-prereleases: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust daemon compat-handler unit tests
        # --no-default-features 关闭 extension-module，让 PyO3 链接 libpython
        # （Cargo.toml [features] 注释明确此为测试模式）。setup-python 提供 libpython。
        run: >-
          cargo test --manifest-path rust_ext/Cargo.toml
          --no-default-features --lib daemon::compat_native_handlers
