name: Acceptance Gates

# TESTING_PLAN §9「CI与命令」的本体：PR / nightly / release 三档验收门禁。
# - PR：清单/文档一致性 + 适用快速测试 + 真实隔离协议 + 关键写/负面
#   （domains PR profile = 除 external 网络依赖域外的 114 selector）；
# - nightly：全仓库 + 恢复/并发 + 外部（Git/Semgrep/LSP/向量）+ 性能
#   （full profile = 127 selector）；
# - release：同候选 hash 全部必需 profile + artifact E2E（干净安装 + 真实入口）。
#
# 门禁判据由两个独立脚本裁决，**两道都必须过**：
#   1. cicd/check_selector_manifest.py —— manifest ↔ 源码实际测试一致性
#      （防「删测试 + 改 manifest」绕过门禁，见 Q2）
#   2. cicd/check_ci_gates.py —— JUnit 递归 + selector 完备性 + revision 新鲜度
#      （防「结果集与清单漂移」，见 Q1）
#   3. cicd/check_skip_rate.py —— 仅辅助统计，**非硬门禁**（§8：零 unexpected
#      skip 硬门禁不能被总 skip≤5% 抵消）
#
# ⚠️ checkout 必须显式 ref：PR 事件下默认检出 merge commit，与 github.sha
#    （PR 头）不等，会让 revision 校验恒红或（若对齐成同一表达式）恒真。
# ⚠️ collect-only **不要加 -q**：pytest 9 的 -q 只输出每文件计数，不输出 nodeid。

on:
  pull_request:
    branches: [main, master]
  push:
    tags: ['v*']
  schedule:
    - cron: "0 18 * * *" # nightly（UTC 18:00）
  workflow_dispatch:
    inputs:
      profile:
        description: "pr | full | release"
        required: false
        default: "pr"

# Windows runner 控制台默认 cp1252，门禁脚本的 verdict/日志含中文，
# print(json.dumps(..., ensure_ascii=False)) 会 UnicodeEncodeError
# （实证 run 40103915482 Gate 1/2）。强制 Python 走 UTF-8。
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

concurrency:
  group: acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pr-acceptance:
    name: PR acceptance (isolation protocol + key write/negative)
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          # Q1 修复：PR 事件下 checkout 默认给 merge commit，与 github.sha（PR 头）
          # 不等 → revision 校验恒红。显式 ref 让二者对齐，校验才有意义。
          ref: ${{ github.sha }}
          # baseline 比对（manifest 相对 origin/main 的增删可见性）需要完整历史
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.14"
          allow-prereleases: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable

      # 与 main CI 对齐：扩展必须在 install 之前构建。setup.py 的
      # PrebuiltBuildExt 在 wheel 构建期硬校验仓库根的 callwarden_core.pyd，
      # 缺失即中止（"预编译二进制不存在"）。原顺序 install 在前 ⇒ PR/nightly
      # 安装步恒红（KR-C 第二层阻断，WS1 移走 semgrep 后暴露）。
      - name: Build Rust extension
        run: python release/build.py --rust
        shell: bash

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
          pip install pytest-xdist pytest-timeout
        shell: bash

      # CD-1（Windows-safe 版）：wheel 不含 db/（仅测试支持层），但
      # tests/conftest.py:5 import callwarden.db.db_base，且 db/ 的 2 处裸导入
      # `from i18n import t` 需仓库根在 sys.path。main CI 在 Linux 用 symlink；
      # Windows runner 不支持 ln -s（需 Developer Mode/特权）⇒ 改用：① 复制仓库根
      # db/ 进已装 wheel 的 callwarden 包；② 仓库根入 PYTHONPATH 供裸 i18n 导入。
      # ⚠️ 源路径是仓库根 `db/`，不是 `callwarden/db/`：pyproject.toml 的
      # package-dir = {"callwarden": "."} 把仓库根映射为 callwarden 包本体。
      - name: Expose repo-root test support (CD-1, Windows-safe)
        shell: bash
        run: |
          echo "PYTHONPATH=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          python -c "import callwarden, os, shutil; src='db'; assert os.path.isdir(src), 'repo db/ 未找到: '+os.getcwd(); dst=os.path.join(os.path.dirname(callwarden.__file__),'db'); shutil.copytree(src,dst,dirs_exist_ok=True); print('copied db ->',dst)"
          PYTHONPATH="$GITHUB_WORKSPACE" python -c "from callwarden.db import db_base; print('callwarden.db OK')"

      # Q2 修复：manifest ↔ 源码一致性（collect-only 不加 -q）
      - name: Collect PR profile selectors (source of truth)
        run: |
          mkdir -p reports
          python -m pytest tests/acceptance/domains/ --ignore=tests/acceptance/domains/external --collect-only --no-header > reports/collected_pr.txt
        shell: bash

      - name: Gate 1/2 — selector manifest vs source (anti-tamper)
        run: >
          python -m cicd.check_selector_manifest
          --collected reports/collected_pr.txt
          --manifest docs/testing/expected_selectors/domains_pr.txt
          --baseline-ref origin/${{ github.event.pull_request.base.ref }}
          --json-out reports/manifest_verdict.json
        shell: bash

      # 与 main CI 对齐：显式构建 daemon 二进制（ALLOW_FRESH_BUILD 仅兜底）。
      - name: Build cw-daemon binary (isolated daemon requirement)
        run: cargo build --manifest-path rust_ext/Cargo.toml --no-default-features --features sqlite-bundled --bin cw-daemon
        shell: bash

      - name: Run PR profile (domains minus external network deps)
        env:
          # 与 main CI 同形：cw-daemon 构建不带 --release ⇒ 产物在 target/debug。
          CW_TP11G_DAEMON_SRC: ${{ github.workspace }}/rust_ext/target/debug/cw-daemon.exe
          CW_TP11G_ALLOW_FRESH_BUILD: "1"
        run: >
          pytest tests/acceptance/domains/ --ignore=tests/acceptance/domains/external
          -q --no-header --junitxml=reports/junit_pr.xml
        shell: bash

      - name: Gate 2/2 — JUnit + selectors + revision freshness
        run: >
          python -m cicd.check_ci_gates
          --junit reports/junit_pr.xml
          --manifest docs/testing/expected_selectors/domains_pr.txt
          --expect-revision ${{ github.sha }}
          --json-out reports/verdict_pr.json
        shell: bash

      - name: Skip rate (auxiliary, non-blocking)
        run: >
          python -m cicd.check_skip_rate
          --junit reports/junit_pr.xml
          --collected reports/collected_pr.txt
          --collect-only-out reports/collected_pr.txt
          --json-out reports/skip_rate_pr.json
        shell: bash

      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: acceptance-pr-evidence
          path: reports/
          if-no-files-found: warn

  nightly-full:
    name: Nightly full profile (recovery/concurrency/external/performance)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.14"
          allow-prereleases: true
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
      # 与 main CI 对齐：扩展必须在 install 之前构建。setup.py 的
      # PrebuiltBuildExt 在 wheel 构建期硬校验仓库根的 callwarden_core.pyd，
      # 缺失即中止（"预编译二进制不存在"）。原顺序 install 在前 ⇒ nightly
      # 安装步恒红（KR-C 第二层阻断，WS1 移走 semgrep 后暴露）。
      - name: Build Rust extension
        run: python release/build.py --rust
        shell: bash
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
          pip install pytest-xdist pytest-timeout
        shell: bash

      # full profile 含 external 域，X3 断言的是**真实 semgrep 扫描结果**
      # （test_x3/x3b/x3c），工具缺失时 daemon 返回 success=false 即红。
      # semgrep 已移出核心依赖（KR-C）；为避免与 mcp/pydantic 依赖树互相
      # 降级，这里用独立 venv 只装 CLI。⚠️ 不能把 venv 的 Scripts 写进
      # GITHUB_PATH：其中的 python.exe 会劫持后续所有 step 的 `python`
      # （实证 run 40106680309 CD-1 步 ModuleNotFoundError: callwarden）。
      # 改为仅在 Run 步内局部前置 PATH，pytest/python 仍解析主环境。
      - name: Install semgrep CLI (external domain requirement)
        shell: bash
        run: |
          python -m venv .semgrep-venv
          ./.semgrep-venv/Scripts/python.exe -m pip install --upgrade pip
          ./.semgrep-venv/Scripts/python.exe -m pip install "semgrep>=1.50"
          ./.semgrep-venv/Scripts/semgrep.exe --version

      # CD-1（Windows-safe 版）：wheel 不含 db/（仅测试支持层），但
      # tests/conftest.py:5 import callwarden.db.db_base，且 db/ 的 2 处裸导入
      # `from i18n import t` 需仓库根在 sys.path。main CI 在 Linux 用 symlink；
      # Windows runner 不支持 ln -s（需 Developer Mode/特权）⇒ 改用：① 复制仓库根
      # db/ 进已装 wheel 的 callwarden 包；② 仓库根入 PYTHONPATH 供裸 i18n 导入。
      # ⚠️ 源路径是仓库根 `db/`，不是 `callwarden/db/`：pyproject.toml 的
      # package-dir = {"callwarden": "."} 把仓库根映射为 callwarden 包本体。
      - name: Expose repo-root test support (CD-1, Windows-safe)
        shell: bash
        run: |
          echo "PYTHONPATH=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          python -c "import callwarden, os, shutil; src='db'; assert os.path.isdir(src), 'repo db/ 未找到: '+os.getcwd(); dst=os.path.join(os.path.dirname(callwarden.__file__),'db'); shutil.copytree(src,dst,dirs_exist_ok=True); print('copied db ->',dst)"
          PYTHONPATH="$GITHUB_WORKSPACE" python -c "from callwarden.db import db_base; print('callwarden.db OK')"

      - name: Collect full profile selectors (source of truth)
        run: |
          mkdir -p reports
          python -m pytest tests/acceptance/domains/ --collect-only --no-header > reports/collected_full.txt
        shell: bash
      - name: Gate 1/2 — selector manifest vs source (anti-tamper)
        run: >
          python -m cicd.check_selector_manifest
          --collected reports/collected_full.txt
          --manifest docs/testing/expected_selectors/domains_full.txt
          --baseline-ref origin/main
          --json-out reports/manifest_verdict.json
        shell: bash
      # 与 main CI 对齐：显式构建 daemon 二进制（ALLOW_FRESH_BUILD 仅兜底）。
      - name: Build cw-daemon binary (isolated daemon requirement)
        run: cargo build --manifest-path rust_ext/Cargo.toml --no-default-features --features sqlite-bundled --bin cw-daemon
        shell: bash

      - name: Run full profile (all domains incl. external)
        shell: bash
        env:
          # 与 main CI 同形：cw-daemon 构建不带 --release ⇒ 产物在 target/debug。
          CW_TP11G_DAEMON_SRC: ${{ github.workspace }}/rust_ext/target/debug/cw-daemon.exe
          CW_TP11G_ALLOW_FRESH_BUILD: "1"
        run: |
          # 仅本步前置 semgrep 的 Scripts（daemon find_semgrep_cli 走 PATH 探测）；
          # 不写入 GITHUB_PATH，避免其 python.exe 劫持后续步骤。
          export PATH="$GITHUB_WORKSPACE/.semgrep-venv/Scripts:$PATH"
          pytest tests/acceptance/domains/ \
            -q --no-header --junitxml=reports/junit_full.xml
      - name: Gate 2/2 — JUnit + selectors + revision freshness
        run: >
          python -m cicd.check_ci_gates
          --junit reports/junit_full.xml
          --manifest docs/testing/expected_selectors/domains_full.txt
          --expect-revision ${{ github.sha }}
          --json-out reports/verdict_full.json
        shell: bash
      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: acceptance-nightly-evidence
          path: reports/
          if-no-files-found: warn

  release-artifact:
    name: Release artifact E2E (clean install + real entries)
    # Q6 修复：打 tag 发版必须跑门禁。原实现只在 workflow_dispatch 且
    # inputs.profile=release 时触发，而 enterprise-release.yml 走 tags: v*
    # → 真实发版路径完全绕过验收门禁。现 tag 与手动 dispatch 都触发，
    # 且先跑 full profile 门禁再跑产物 E2E。
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.profile == 'release')
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.14"
          allow-prereleases: true
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
      - name: Build wheel + daemon candidate
        run: |
          python release/build.py --rust
          python -m pip wheel . --no-build-isolation --no-deps -w dist
          # 与 main CI 同形：full profile / artifact E2E 都要求隔离 daemon 二进制，
          # debug 产物在 rust_ext/target/debug/（下方 env 同源）。
          cargo build --manifest-path rust_ext/Cargo.toml --no-default-features --features sqlite-bundled --bin cw-daemon
        shell: bash

      # CD-1（Windows-safe 版）：wheel 不含 db/（仅测试支持层），但
      # tests/conftest.py:5 import callwarden.db.db_base，且 db/ 的 2 处裸导入
      # `from i18n import t` 需仓库根在 sys.path。main CI 在 Linux 用 symlink；
      # Windows runner 不支持 ln -s（需 Developer Mode/特权）⇒ 改用：① 复制仓库根
      # db/ 进已装 wheel 的 callwarden 包；② 仓库根入 PYTHONPATH 供裸 i18n 导入。
      # ⚠️ 源路径是仓库根 `db/`，不是 `callwarden/db/`：pyproject.toml 的
      # package-dir = {"callwarden": "."} 把仓库根映射为 callwarden 包本体。
      - name: Expose repo-root test support (CD-1, Windows-safe)
        shell: bash
        run: |
          echo "PYTHONPATH=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          python -c "import callwarden, os, shutil; src='db'; assert os.path.isdir(src), 'repo db/ 未找到: '+os.getcwd(); dst=os.path.join(os.path.dirname(callwarden.__file__),'db'); shutil.copytree(src,dst,dirs_exist_ok=True); print('copied db ->',dst)"
          PYTHONPATH="$GITHUB_WORKSPACE" python -c "from callwarden.db import db_base; print('callwarden.db OK')"

      - name: Collect full profile selectors (source of truth)
        run: |
          mkdir -p reports
          python -m pytest tests/acceptance/domains/ --collect-only --no-header > reports/collected_full.txt
        shell: bash
      - name: Gate 1/2 — selector manifest vs source
        run: >
          python -m cicd.check_selector_manifest
          --collected reports/collected_full.txt
          --manifest docs/testing/expected_selectors/domains_full.txt
          --baseline-ref origin/main
          --json-out reports/manifest_verdict.json
        shell: bash
      - name: Run full profile (release 档跑全部必需 profile)
        env:
          CW_TP11G_DAEMON_SRC: ${{ github.workspace }}/rust_ext/target/debug/cw-daemon.exe
          CW_TP11G_ALLOW_FRESH_BUILD: "1"
        run: >
          pytest tests/acceptance/domains/
          -q --no-header --junitxml=reports/junit_full.xml
        shell: bash
      - name: Gate 2/2 — JUnit + selectors + revision freshness
        run: >
          python -m cicd.check_ci_gates
          --junit reports/junit_full.xml
          --manifest docs/testing/expected_selectors/domains_full.txt
          --expect-revision ${{ github.sha }}
          --json-out reports/verdict_full.json
        shell: bash
      - name: Artifact E2E (clean venv install + isolated daemon + CLI + MCP wire)
        env:
          CW_ARTIFACT_DAEMON_SRC: ${{ github.workspace }}/rust_ext/target/debug/cw-daemon.exe
        run: >
          python -m cicd.artifact_e2e
          --json-out reports/artifact_verdict.json
        shell: bash
      - name: Upload artifact evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: acceptance-release-evidence
          path: reports/
          if-no-files-found: warn
