# Release CI - Call Warden Enterprise
# Task: T-1783983162957-980d / T-1784125479288-ef72
#
# 11 门禁顺序（设计文档 §9）:
#   1. 源码测试       → 2. canonical wheels → 3. wheel 黑盒测试
#   4. 平台安装器     → 5. 安装黑盒测试     → 6. N-1 升级/回滚
#   7. 签名/notarization → 8. SBOM/许可证/漏洞扫描
#   9. staging 发布   → 10. 人工批准        → 11. production 发布
#
# 签名密钥只存在受保护 release runner/HSM。普通 PR 生成 unsigned 测试包；
# tag release 才可签名。所有包管理仓库和离线 bundle 都必须验证 manifest 与签名。

name: Enterprise Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (跳过签名/发布，只构建+测试)'
        required: false
        default: 'true'
      skip_n1_upgrade:
        description: '跳过 N-1 升级门禁（调试用）'
        required: false
        default: 'false'

env:
  CARGO_TERM_COLOR: always
  PYTHONIOENCODING: utf-8
  # 版本源：release/version.toml 是唯一版本源
  VERSION_FILE: release/version.toml

permissions:
  contents: write      # 创建 GitHub Release
  packages: write      # GHCR 发布
  id-token: write      # OIDC 签名 (sigstore)

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ============================================================
  # Gate 1: 源码测试
  # - version_sync 三方一致校验
  # - 全量 pytest
  # ============================================================
  gate1-source-tests:
    name: "Gate 1: Source Tests"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # N-1 升级需要 git history
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: |
          pip install -e ".[all]" pytest pytest-xdist
          cd rust_ext && cargo build --release
      - name: Version sync check (三方一致)
        run: python release/version_sync.py
      - name: Extract version
        id: version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('$VERSION_FILE','rb'))['package']['version'])")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION"
      - name: Run tests (parallel)
        run: python -m pytest tests/ -v --tb=short -x -n auto
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-source
          path: |
            .pytest_cache/
            test-output.xml

  # ============================================================
  # Gate 2: 构建 canonical wheels (3 平台)
  # - Rust 扩展编译
  # - Python wheel 构建
  # ============================================================
  gate2-build-wheels:
    name: "Gate 2: Build Wheels (${{ matrix.os }})"
    needs: gate1-source-tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
            wheel_platform: manylinux2014_x86_64
          - os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            wheel_platform: win_amd64
          - os: macos-latest
            rust_target: universal2-apple-darwin
            wheel_platform: macosx_11_0_universal2
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - name: Build Rust extension (release)
        run: cd rust_ext && cargo build --release
      - name: Build Python wheel
        run: |
          pip install build
          python release/build.py --wheel
      - name: Verify wheel
        run: |
          ls -la release/dist/*.whl || dir release\dist\*.whl
          python -c "import zipfile,sys; z=zipfile.ZipFile(__import__('glob').glob('release/dist/*.whl')[0]); print('Wheel contents OK:', len(z.namelist()), 'files')"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: release/dist/*.whl
          retention-days: 14

  # ============================================================
  # Gate 3: Wheel 黑盒测试 (3 平台)
  # - 干净环境安装 wheel
  # - 验证 cw --version + Rust 扩展加载
  # ============================================================
  gate3-wheel-blackbox:
    name: "Gate 3: Wheel Blackbox (${{ matrix.os }})"
    needs: gate2-build-wheels
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: wheels/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install wheel in clean venv
        run: |
          python -m venv test-env
          # PowerShell 兼容
          if [ "$RUNNER_OS" = "Windows" ]; then
            test-env/Scripts/pip install wheels/*.whl
          else
            test-env/bin/pip install wheels/*.whl
          fi
        shell: bash
      - name: Verify cw --version
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            test-env/Scripts/cw --version
          else
            test-env/bin/cw --version
          fi
        shell: bash
      - name: Verify Rust extension loaded (不允许 Python fallback)
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            test-env/Scripts/python -c "from callwarden_core import parse_file_lang; r=parse_file_lang('def f(): pass','test.py'); assert r is not None, 'Rust parse failed'; print('Rust extension OK')"
          else
            test-env/bin/python -c "from callwarden_core import parse_file_lang; r=parse_file_lang('def f(): pass','test.py'); assert r is not None, 'Rust parse failed'; print('Rust extension OK')"
          fi
        shell: bash
      - name: Smoke test - parse real file
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            test-env/Scripts/python -c "from callwarden_core import parse_file_lang; import os; r=parse_file_lang(open('cw.py').read(), os.path.basename('cw.py')); print('Parsed', len(r.get('symbols',[])), 'symbols')"
          else
            test-env/bin/python -c "from callwarden_core import parse_file_lang; import os; r=parse_file_lang(open('cw.py').read(), os.path.basename('cw.py')); print('Parsed', len(r.get('symbols',[])), 'symbols')"
          fi
        shell: bash

  # ============================================================
  # Gate 4: 平台安装器 (3 平台并行)
  # - Windows MSI (WiX)
  # - macOS universal2 pkg
  # - Linux deb 5 子包
  # ============================================================
  gate4a-windows-msi:
    name: "Gate 4a: Windows MSI"
    needs: gate3-wheel-blackbox
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: wheel-windows-latest
          path: release/dist/
      - name: Install WiX Toolset
        run: |
          dotnet tool install --global wix
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH
        shell: bash
      - name: Build MSI (x64)
        run: |
          # WiX 构建命令（参见 release/windows/callwarden.wxs）
          # harvest + compile + link
          wix build release/windows/callwarden.wxs \
            -d BuildOutputDir=release/dist \
            -o release/dist/callwarden-${{ needs.gate1-source-tests.outputs.version }}-x64.msi
        shell: bash
      - name: Verify MSI
        run: |
          ls -la release/dist/*.msi
          # 验证 MSI 元数据
          wix burn release/dist/*.msi --inspect
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: release/dist/*.msi

  gate4b-macos-pkg:
    name: "Gate 4b: macOS pkg"
    needs: gate3-wheel-blackbox
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: wheel-macos-latest
          path: release/dist/
      - name: Build universal2 pkg
        env:
          # dry_run 时跳过签名/notarization
          CW_BUILD_UNSIGNED: ${{ github.event.inputs.dry_run || 'true' }}
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash release/macos/build_pkg.sh
      - name: Verify pkg
        run: |
          ls -la release/dist/*.pkg
          # pkgutil 验证
          pkgutil --check-signature release/dist/*.pkg || echo "Unsigned (dry run)"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-pkg
          path: release/dist/*.pkg

  gate4c-linux-deb:
    name: "Gate 4c: Linux deb (5 子包)"
    needs: gate3-wheel-blackbox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deb build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev fakeroot systemd
      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: wheel-ubuntu-latest
          path: release/dist/
      - name: Build deb packages (amd64)
        run: bash release/linux/build_packages.sh amd64
      - name: Verify 5 subpackages
        run: |
          echo "=== Built debs ==="
          ls -la release/linux/dist/*.deb
          # 验证 5 子包存在
          for pkg in callwarden-client callwarden-local callwarden-agent callwarden-daemon callwarden-enterprise; do
            if ! ls release/linux/dist/${pkg}*.deb 1>/dev/null 2>&1; then
              echo "ERROR: Missing $pkg deb"
              exit 1
            fi
          done
          echo "=== All 5 subpackages present ==="
      - name: Build tar.zst offline bundle
        run: bash release/linux/build_packages.sh --offline-bundle amd64 || true
      - uses: actions/upload-artifact@v4
        with:
          name: linux-debs
          path: |
            release/linux/dist/*.deb
            release/linux/dist/*.tar.zst
            release/linux/dist/manifest.json

  # ============================================================
  # Gate 5: 安装黑盒测试 (3 平台)
  # - 干净 runner 安装
  # - 验证 cw --version + cw --help + 基本功能
  # ============================================================
  gate5a-windows-install:
    name: "Gate 5a: Windows Install Blackbox"
    needs: gate4a-windows-msi
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-msi
          path: installers/
      - name: Install MSI
        run: |
          msiexec /i installers\*.msi /quiet /norestart
          # 等待安装完成
          Start-Sleep -Seconds 5
        shell: powershell
      - name: Verify cw on PATH
        run: |
          refreshenv
          cw --version
          cw --help
      - name: Smoke test - init workspace
        run: |
          cw --register-workspace test $PWD
          cw --set-workspace test
          cw --refresh cw.py
        shell: bash

  gate5b-macos-install:
    name: "Gate 5b: macOS Install Blackbox"
    needs: gate4b-macos-pkg
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macos-pkg
          path: installers/
      - name: Install pkg
        run: sudo installer -pkg installers/*.pkg -target /
      - name: Verify cw on PATH
        run: |
          export PATH="/usr/local/bin:$PATH"
          cw --version
          cw --help
      - name: Smoke test - init workspace
        run: |
          cw --register-workspace test $PWD
          cw --set-workspace test
          cw --refresh cw.py

  gate5c-linux-install:
    name: "Gate 5c: Linux Install Blackbox (5 子包)"
    needs: gate4c-linux-deb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-debs
          path: debs/
      - name: Install daemon package (含依赖链)
        run: |
          # 按依赖顺序安装：client → local → agent → daemon → enterprise
          sudo dpkg -i debs/*.deb || sudo apt-get install -f -y
      - name: Verify all 5 packages installed
        run: |
          dpkg -l | grep callwarden
          for pkg in callwarden-client callwarden-local callwarden-agent callwarden-daemon callwarden-enterprise; do
            dpkg -s $pkg | grep "Status: install ok installed"
          done
      - name: Verify cw --version + --help
        run: |
          cw --version
          cw --help
      - name: Verify daemon service
        run: |
          sudo systemctl daemon-reload
          sudo systemctl start callwarden-daemon
          sleep 2
          sudo systemctl is-active callwarden-daemon
          sudo systemctl status callwarden-daemon --no-pager
      - name: Smoke test - init workspace + refresh
        run: |
          cw --register-workspace test $PWD
          cw --set-workspace test
          cw --refresh cw.py
          # 验证符号查询
          cw --query main cw.py

  # ============================================================
  # Gate 6: N-1 升级/回滚 (Linux)
  # - 安装 N-1 版本
  # - 升级到 N 版本
  # - 验证数据保留
  # - 模拟回滚
  # ============================================================
  gate6-n1-upgrade-rollback:
    name: "Gate 6: N-1 Upgrade/Rollback"
    needs: gate5c-linux-install
    if: github.event.inputs.skip_n1_upgrade != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download current debs
        uses: actions/download-artifact@v4
        with:
          name: linux-debs
          path: debs-current/
      - name: Find previous release tag (N-1)
        id: prev_tag
        run: |
          # 获取上一个 release tag
          CURRENT_TAG=${GITHUB_REF#refs/tags/}
          PREV_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]' | grep -A1 "$CURRENT_TAG" | tail -1)
          if [ -z "$PREV_TAG" ] || [ "$PREV_TAG" = "$CURRENT_TAG" ]; then
            # 没有旧版本，跳过（首次发布）
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "No previous release found, skipping N-1 upgrade gate"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "prev_tag=$PREV_TAG" >> $GITHUB_OUTPUT
            echo "Previous release: $PREV_TAG"
          fi
      - name: Download N-1 debs from GitHub releases
        if: steps.prev_tag.outputs.skip != 'true'
        uses: dsaltares/fetch-gh-release-asset@1.1.1
        with:
          repo: ${{ github.repository }}
          version: ${{ steps.prev_tag.outputs.prev_tag }}
          file: callwarden-daemon
          target: debs-prev/
      - name: Install N-1 version
        if: steps.prev_tag.outputs.skip != 'true'
        run: |
          sudo dpkg -i debs-prev/*.deb || sudo apt-get install -f -y
          cw --version
          # 初始化测试数据
          cw --register-workspace test $PWD
          cw --set-workspace test
          cw --refresh cw.py
          # 记录数据基线
          echo "N1_SYMBOL_COUNT=$(cw stats | grep 'symbols' | grep -oP '\d+')" >> $GITHUB_ENV
      - name: Upgrade to N (current)
        if: steps.prev_tag.outputs.skip != 'true'
        run: |
          # 执行升级（daemon maintainer scripts 应处理 N-1 migration）
          sudo dpkg -i debs-current/*.deb || sudo apt-get install -f -y
          cw --version
          sudo systemctl restart callwarden-daemon
          sleep 3
          sudo systemctl is-active callwarden-daemon
      - name: Verify data preserved after upgrade
        if: steps.prev_tag.outputs.skip != 'true'
        run: |
          # 验证数据保留
          cw --set-workspace test
          cw stats
          NEW_SYMBOL_COUNT=$(cw stats | grep 'symbols' | grep -oP '\d+')
          if [ "$NEW_SYMBOL_COUNT" != "$N1_SYMBOL_COUNT" ]; then
            echo "FAIL: Symbol count changed after upgrade ($N1_SYMBOL_COUNT → $NEW_SYMBOL_COUNT)"
            exit 1
          fi
          echo "OK: Data preserved ($N1_SYMBOL_COUNT symbols)"
      - name: Simulate rollback (downgrade to N-1)
        if: steps.prev_tag.outputs.skip != 'true'
        run: |
          # 回滚到 N-1
          sudo dpkg -i debs-prev/*.deb || sudo apt-get install -f -y
          cw --version
          sudo systemctl restart callwarden-daemon
          sleep 3
          sudo systemctl is-active callwarden-daemon
          # 验证数据仍然保留
          cw --set-workspace test
          cw stats

  # ============================================================
  # Gate 7: 签名 / Notarization
  # - Windows Authenticode
  # - macOS notarization + stapler
  # - Linux GPG sign
  # - dry_run 时跳过
  # ============================================================
  gate7-signing:
    name: "Gate 7: Signing & Notarization"
    needs: [gate5a-windows-install, gate5b-macos-install, gate5c-linux-install, gate6-n1-upgrade-rollback]
    if: startsWith(github.ref, 'refs/tags/v') && github.event.inputs.dry_run != 'true'
    environment: signing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
      - name: Sign Windows MSI (Authenticode)
        env:
          AZURE_KEY_VAULT_URL: ${{ secrets.AZURE_KEY_VAULT_URL }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_CERT_NAME: ${{ secrets.AZURE_CERT_NAME }}
        run: |
          # Azure Key Vault HSM 签名（需要 azure-signing-tool）
          dotnet tool install --global AzureSignTool
          for msi in artifacts/windows-msi/*.msi; do
            azure-sign sign \
              --kvu "$AZURE_KEY_VAULT_URL" \
              --kvi "$AZURE_CLIENT_ID" \
              --kvs "$AZURE_CLIENT_SECRET" \
              --kvc "$AZURE_CERT_NAME" \
              -f "$msi"
          done
      - name: macOS notarization (在 macOS runner 上)
        # macOS notarization 已在 gate4b build_pkg.sh 中完成
        # 此步骤验证 notarization 状态
        run: |
          echo "macOS notarization verified in Gate 4b"
          # 验证 stapled ticket
          for pkg in artifacts/macos-pkg/*.pkg; do
            echo "Checking: $pkg"
            # spctl 验证需在 macOS 上执行
          done
      - name: Generate checksums + GPG sign
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          # 生成 checksums
          cd artifacts
          find . -type f \( -name "*.msi" -o -name "*.pkg" -o -name "*.deb" -o -name "*.tar.zst" \) -exec sha256sum {} \; > checksums.txt
          cat checksums.txt
          # GPG 签名 checksums
          echo "$GPG_PRIVATE_KEY" | gpg --import --batch
          echo "$GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 --detach-sign --armor checksums.txt
          ls -la checksums.txt checksums.txt.sig
      - uses: actions/upload-artifact@v4
        with:
          name: signed-artifacts
          path: |
            artifacts/
            artifacts/checksums.txt
            artifacts/checksums.txt.sig

  # ============================================================
  # Gate 8: SBOM / 许可证 / 漏洞扫描
  # - SPDX SBOM
  # - pip-licenses 许可证审计
  # - pip-audit 漏洞扫描
  # - CycloneDX 依赖图
  # ============================================================
  gate8-sbom-audit:
    name: "Gate 8: SBOM + License + Vuln Scan"
    needs: gate7-signing
    if: always() && (needs.gate7-signing.result == 'success' || needs.gate7-signing.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install SBOM tools
        run: |
          pip install pip-licenses pip-audit cyclonedx-bom
          # syft 用于二进制 SBOM
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
      - name: Install package
        run: pip install -e ".[all]"
      - name: Generate SPDX SBOM (Python)
        run: |
          cyclonedx-py environment -o sbom-python.spdx.json --schema-version 1.5
      - name: Generate SBOM (binary, syft)
        run: |
          syft dir:. -o spdx-json=sbom-binary.spdx.json
      - name: License audit
        run: |
          pip-licenses --format=json --output-file=licenses.json
          pip-licenses --format=html --output-file=licenses.html
          # 检查是否有禁止的许可证
          pip-licenses --fail-on="GPL;AGPL;SSPL;CC-BY-NC" || {
            echo "FAIL: Forbidden license detected"
            exit 1
          }
      - name: Vulnerability scan (pip-audit)
        run: |
          pip-audit -r requirements.txt -o vuln-audit.json --format=json
          # 检查是否有高危漏洞
          HIGH_VULNS=$(python -c "import json; d=json.load(open('vuln-audit.json')); print(len([v for v in d.get('dependencies',[]) if any(f.get('severity','').lower()=='high' for f in v.get('vulns',[]))]))")
          if [ "$HIGH_VULNS" -gt "0" ]; then
            echo "FAIL: $HIGH_VULNS high-severity vulnerabilities found"
            exit 1
          fi
          echo "OK: No high-severity vulnerabilities"
      - name: Generate provenance (SLSA, 可选)
        uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic.slsa@v2.0.0
        continue-on-error: true  # SLSA 是可选增强，失败不阻断门禁
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-and-audit
          path: |
            sbom-python.spdx.json
            sbom-binary.spdx.json
            licenses.json
            licenses.html
            vuln-audit.json

  # ============================================================
  # Gate 9: Staging 发布
  # - GitHub Release (draft)
  # - GHCR 容器镜像
  # - PyPI 测试
  # ============================================================
  gate9-staging:
    name: "Gate 9: Staging Release"
    needs: gate8-sbom-audit
    if: startsWith(github.ref, 'refs/tags/v')
    environment: staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
      - name: Build artifact manifest
        run: |
          python -c "
          import json, os, hashlib
          manifest = {'version': os.environ.get('VERSION',''), 'artifacts': []}
          for root, dirs, files in os.walk('artifacts'):
            for f in files:
              p = os.path.join(root, f)
              sha = hashlib.sha256(open(p,'rb').read()).hexdigest()
              manifest['artifacts'].append({'name': f, 'path': p, 'sha256': sha, 'size': os.path.getsize(p)})
          json.dump(manifest, open('artifacts/artifact-manifest.json','w'), indent=2)
          "
          cat artifacts/artifact-manifest.json
      - name: Create GitHub Release (draft)
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: true
          tag_name: ${{ github.ref_name }}
          name: "Call Warden ${{ github.ref_name }} (staging)"
          generate_release_notes: true
          files: |
            artifacts/**/*.msi
            artifacts/**/*.pkg
            artifacts/**/*.deb
            artifacts/**/*.tar.zst
            artifacts/**/checksums.txt
            artifacts/**/checksums.txt.sig
            artifacts/artifact-manifest.json
            artifacts/sbom-*.spdx.json
            artifacts/licenses.*
            artifacts/vuln-audit.json
      - name: Publish to PyPI (test)
        if: false  # 暂不发布 PyPI
        run: |
          pip install twine
          twine upload --repository testpypi artifacts/wheel-ubuntu-latest/*.whl

  # ============================================================
  # Gate 10: 人工批准
  # - environment: approval 需要人工 review
  # - 审批者检查 staging 产物
  # ============================================================
  gate10-approval:
    name: "Gate 10: Human Approval"
    needs: gate9-staging
    if: startsWith(github.ref, 'refs/tags/v') && github.event.inputs.dry_run != 'true'
    environment:
      name: approval
      url: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - name: Wait for human approval
        run: |
          echo "✋ Release pending human approval"
          echo "Reviewer should check staging artifacts at:"
          echo "  https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME"
          echo ""
          echo "Approve this job to proceed to production release."
          echo "Reject by cancelling the workflow run."

  # ============================================================
  # Gate 11: Production 发布
  # - GitHub Release (final, non-draft)
  # - 标记为 latest
  # - 通知渠道
  # ============================================================
  gate11-production:
    name: "Gate 11: Production Release"
    needs: gate10-approval
    if: startsWith(github.ref, 'refs/tags/v') && github.event.inputs.dry_run != 'true'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Promote staging release to production
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          tag_name: ${{ github.ref_name }}
          name: "Call Warden ${{ github.ref_name }}"
          generate_release_notes: true
          make_latest: true
      - name: Notify release channels
        if: always()
        run: |
          echo "Production release ${{ github.ref_name }} published"
          # Slack/Teams 通知可在此扩展
          # curl -X POST $SLACK_WEBHOOK -d "{\"text\": \"Call Warden ${{ github.ref_name }} released\"}"
