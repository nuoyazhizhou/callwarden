name: PyInstaller Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      skip_release:
        description: 'Skip GitHub Release upload'
        type: boolean
        default: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-amd64
            ext: zip
            max_unpacked_mb: 150
          - os: windows-11-arm
            platform: windows-arm64
            ext: zip
            max_unpacked_mb: 150
          - os: ubuntu-22.04
            platform: linux-amd64
            ext: tar.gz
            max_unpacked_mb: 260
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            ext: tar.gz
            max_unpacked_mb: 260
          - os: macos-latest
            platform: macos-arm64
            ext: tar.gz
            max_unpacked_mb: 220
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust extension and copy to project root
        run: python release/build.py --rust

      - name: Build Rust daemon for Linux bundle
        if: startsWith(matrix.os, 'ubuntu')
        run: cargo build --release --manifest-path rust_ext/Cargo.toml --no-default-features --bin cw-daemon

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # 冻结包只安装经过审计的运行时白名单，不安装 requirements.txt/[all]。
          python -m pip install -r release/pyinstaller/requirements-build.txt
          # 项目依赖已经由白名单提供，禁止 pip 再解析可选依赖。
          python -m pip install . --no-deps
          # ARM runner 上确保 PyInstaller 安装到当前 setup-python 解释器，不能只依赖
          # requirements 的间接安装结果；立即导入验证，避免构建阶段才报缺包。
          python -m pip install --upgrade --force-reinstall --no-cache-dir PyInstaller==6.21.0
          python -m pip install --upgrade --force-reinstall --no-cache-dir numpy==2.4.3
          python -m pip install --upgrade --force-reinstall --no-cache-dir "mcp[rich]==1.28.1"
          python -c "import PyInstaller, numpy, mcp, sys; print('PyInstaller', PyInstaller.__version__, 'numpy', numpy.__version__, 'mcp', mcp.__version__, 'Python', sys.executable)"

      - name: Run PyInstaller
        run: python -m PyInstaller release/pyinstaller/callwarden.spec --noconfirm --clean

      - name: Smoke-test frozen executables
        shell: bash
        run: |
          set -euo pipefail
          EXE_SUFFIX=""
          if [ "${{ runner.os }}" = "Windows" ]; then
            EXE_SUFFIX=".exe"
          fi

          "./dist/callwarden/cw${EXE_SUFFIX}" --version
          "./dist/callwarden/cw${EXE_SUFFIX}" --help >/dev/null
          "./dist/callwarden/cw${EXE_SUFFIX}" server --check-imports
          if [ "${{ runner.os }}" = "Linux" ]; then
            # client/agent 是独立的轻量 bundle，不在 local bundle 目录内。
            "./dist/callwarden-client/cw-client${EXE_SUFFIX}" --help >/dev/null
            "./dist/callwarden-client/cw-agent${EXE_SUFFIX}" --help >/dev/null
          fi

      - name: Package artifacts
        shell: bash
        run: |
          ARTIFACT="callwarden-${{ matrix.platform }}.${{ matrix.ext }}"
          cd dist
          if [ "${{ matrix.ext }}" = "zip" ]; then
            # Windows: zip archive（bash 变量通过参数传给 PowerShell）
            powershell -Command "Compress-Archive -Path 'callwarden' -DestinationPath \"../$ARTIFACT\""
          else
            if [ "${{ matrix.platform }}" = "linux-amd64" ] || [ "${{ matrix.platform }}" = "linux-arm64" ]; then
              # Linux enterprise all-in-one：local + client/agent 共用一个归档。
              tar czf "../$ARTIFACT" callwarden/ callwarden-client/
            else
              tar czf "../$ARTIFACT" callwarden/
            fi
          fi
          cd ..
          REPORT="callwarden-${{ matrix.platform }}-bundle-report.json"
          python release/inspect_pyinstaller_bundle.py \
            --bundle dist/callwarden \
            --pyz-toc build/callwarden/PYZ-00.toc \
            --artifact "$ARTIFACT" \
            --report "$REPORT" \
            --max-unpacked-mb "${{ matrix.max_unpacked_mb }}"
          if [ "${{ matrix.platform }}" = "linux-amd64" ] || [ "${{ matrix.platform }}" = "linux-arm64" ]; then
            python release/inspect_pyinstaller_bundle.py \
              --bundle dist/callwarden-client \
              --pyz-toc build/callwarden/PYZ-01.toc \
              --artifact "$ARTIFACT" \
              --report "callwarden-${{ matrix.platform }}-client-bundle-report.json" \
              --role client
          fi
          echo "artifact=$ARTIFACT" >> $GITHUB_ENV
          echo "report=$REPORT" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact }}
          path: |
            ${{ env.artifact }}
            ${{ env.report }}

      - name: Upload Linux client bundle report
        if: startsWith(matrix.os, 'ubuntu')
        uses: actions/upload-artifact@v4
        with:
          name: callwarden-${{ matrix.platform }}-client-bundle-report
          path: callwarden-${{ matrix.platform }}-client-bundle-report.json

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && !inputs.skip_release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            callwarden-windows-amd64.zip
            callwarden-windows-arm64.zip
            callwarden-linux-amd64.tar.gz
            callwarden-linux-arm64.tar.gz
            callwarden-macos-arm64.tar.gz
          generate_release_notes: true
          prerelease: ${{ contains(github.ref, '-') }}
