# P2-H Step 3: Linux aarch64 + musl artifact E2E 验证
# 设计文档：docs/design/rust-only-parser-cutover-plan.md §8 Phase 6
#
# 验证矩阵（设计 §8 Phase 6）：
#   | 平台  | 架构    | 角色                       |
#   | Linux | aarch64 | local/client/agent/daemon |
#
# 附加 Linux 兼容矩阵（设计 §8 Phase 6）：
#   - musl 静态构建
#   - Ubuntu 14.04–24.04 容器挂载路径（glibc 下限已在 Step 2 覆盖）
#   - ABI manifest（OS/arch/libc/parser ABI/grammar versions）
#
# 检查项：
#   - aarch64 真 runner（GitHub 提供 ubuntu-24.04-arm）
#   - musl 静态构建（在 alpine 容器中构建并验证）
#   - ABI manifest 生成（记录 OS/arch/libc/parser ABI/grammar versions）
#
# 触发：手动 workflow_dispatch、tag push (v*)、或 PR 改动 release/ 或 .github/workflows/e2e/
#
# 任务：T-1784986236714-ca26c424 Step 3
# 文件所有权：Release Validation Agent（不修改实现代码）

name: P2-H E2E Linux aarch64 + musl

on:
  workflow_dispatch:
    inputs:
      skip_step5:
        description: '跳过 step5（全量 build + refresh + watcher）'
        type: boolean
        default: false
      skip_step7:
        description: '跳过 step7（schema upgrade/rollback）'
        type: boolean
        default: false
      skip_musl:
        description: '跳过 musl 静态构建验证（alpine 容器）'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'
    paths:
      - '.github/workflows/e2e-verify-linux-aarch64.yml'
      - '.github/workflows/e2e/**'
      - 'release/**'
      - 'pyproject.toml'
      - 'rust_ext/**'
      - 'cw.py'
      - 'callwarden/**'
      - 'db/**'
      - 'server/**'
      - 'cli/**'
      - 'parsers/**'
  pull_request:
    paths:
      - '.github/workflows/e2e-verify-linux-aarch64.yml'
      - '.github/workflows/e2e/**'
      - 'release/**'

env:
  CARGO_TERM_COLOR: always
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: '1'

permissions:
  contents: read

concurrency:
  group: p2h-linux-aarch64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-aarch64-e2e:
    name: Linux aarch64 E2E (local + client/agent/daemon)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust extension (aarch64)
        run: python release/build.py --rust

      - name: Build Rust daemon (aarch64)
        run: cargo build --release --manifest-path rust_ext/Cargo.toml --no-default-features --bin cw-daemon

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --prefer-binary --retries 5 --timeout 60 -r release/pyinstaller/requirements-build.txt
          python -m pip install . --no-deps
          python -m pip install --prefer-binary --retries 5 --timeout 60 psutil

      - name: Run PyInstaller (local + client/agent)
        run: python -m PyInstaller release/pyinstaller/callwarden.spec --noconfirm --clean

      - name: Verify bundle layout
        run: |
          set -euo pipefail
          echo "=== bundle 目录结构 ==="
          ls -la dist/
          echo ""
          echo "=== local bundle ==="
          file dist/callwarden/cw
          echo ""
          echo "=== client/agent bundle ==="
          file dist/callwarden-client/cw-client dist/callwarden-client/cw-agent

      - name: Smoke-test frozen executables (pre-E2E)
        run: |
          set -euo pipefail
          ./dist/callwarden/cw --version
          ./dist/callwarden/cw --help >/dev/null
          ./dist/callwarden/cw server --check-imports
          ./dist/callwarden-client/cw-client >/dev/null
          ./dist/callwarden-client/cw-agent >/dev/null

      - name: Package artifacts
        run: |
          tar czf callwarden-linux-aarch64.tar.gz -C dist callwarden/
          tar czf callwarden-client-linux-aarch64.tar.gz -C dist callwarden-client/
          echo "Local artifact size: $(stat -c%s callwarden-linux-aarch64.tar.gz) bytes"
          echo "Client artifact size: $(stat -c%s callwarden-client-linux-aarch64.tar.gz) bytes"

      - name: Generate ABI manifest
        run: |
          set -euo pipefail
          # 收集 OS/arch/libc/parser ABI/grammar versions，写入 manifest
          python - <<'PY' > abi-manifest-aarch64.json
          import json
          import platform
          import subprocess
          import sys
          from pathlib import Path

          # 读取 callwarden_core.so 的 ABI 信息
          so_files = list(Path("dist/callwarden").rglob("callwarden_core.so"))
          core_info = {"found": bool(so_files), "path": str(so_files[0]) if so_files else None}

          # libc 检测
          libc = "glibc"
          libc_version = ""
          try:
              with open("/proc/version") as f:
                  libc_version = f.read().strip()
          except OSError:
              pass

          # ldd 版本
          ldd_output = ""
          try:
              ldd_output = subprocess.run(["ldd", "--version"], capture_output=True, text=True, timeout=5).stdout
          except (subprocess.SubprocessError, FileNotFoundError):
              pass

          # callwarden_core 支持的语言
          supported_langs = []
          try:
              import importlib.util
              if so_files:
                  spec = importlib.util.spec_from_file_location("cw_core_verify", so_files[0])
                  mod = importlib.util.module_from_spec(spec)
                  spec.loader.exec_module(mod)
                  if hasattr(mod, "supported_languages"):
                      supported_langs = sorted(mod.supported_languages())
          except Exception as e:
              supported_langs = [f"<error: {e}>"]

          manifest = {
              "product": "callwarden",
              "platform": "linux-aarch64",
              "os": {"system": platform.system(), "release": platform.release()},
              "arch": {"machine": platform.machine(), "bits": 64 if sys.maxsize > 2**32 else 32},
              "libc": {
                  "name": libc,
                  "ldd_version": ldd_output.split("\n")[0] if ldd_output else "",
              },
              "python": {"version": platform.python_version(), "implementation": platform.python_implementation()},
              "rust_extension": core_info,
              "parser_abi": {
                  "supported_languages": supported_langs,
                  "language_count": len(supported_langs),
              },
              "grammar_versions": "TODO: 从 Cargo.lock 提取 tree-sitter-* crate 版本",
          }
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY
          echo "=== ABI Manifest (aarch64) ==="
          cat abi-manifest-aarch64.json

      - name: Run local bundle E2E (8 steps)
        run: |
          EXTRA_ARGS=()
          if [ "${{ inputs.skip_step5 }}" = "true" ]; then
            EXTRA_ARGS+=("--skip-step5")
          fi
          if [ "${{ inputs.skip_step7 }}" = "true" ]; then
            EXTRA_ARGS+=("--skip-step7")
          fi

          python \
            .github/workflows/e2e/run_platform_e2e.py \
            --bundle dist/callwarden \
            --pyz-toc build/callwarden/PYZ-00.toc \
            --artifact callwarden-linux-aarch64.tar.gz \
            --platform linux-aarch64 \
            --role local \
            --report e2e-report-linux-aarch64-local.json \
            "${EXTRA_ARGS[@]}"

          exit_code=$?
          echo "Local E2E exit code: $exit_code"
          if [ "$exit_code" -ne 0 ]; then
            echo "::warning::Local E2E 验证返回非零退出码 $exit_code"
          fi

      - name: Verify client/agent bundle parser exclusion (P1-G fail closed)
        run: |
          python release/inspect_pyinstaller_bundle.py \
            --bundle dist/callwarden-client \
            --pyz-toc build/callwarden/PYZ-01.toc \
            --artifact callwarden-client-linux-aarch64.tar.gz \
            --report e2e-step3-client-bundle-report.json \
            --role client

      - name: Diagnose client bundle gate (always)
        if: always()
        run: |
          python -c 'import json, pathlib; p=pathlib.Path("e2e-step3-client-bundle-report.json"); r=json.loads(p.read_text(encoding="utf-8")) if p.exists() else {"errors":["client inspector report missing"]}; [print("::error file=.github/workflows/e2e-verify-linux-aarch64.yml::" + str(e)) for e in r.get("errors", [])]'

      - name: Upload E2E reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-linux-aarch64
          path: |
            e2e-report-linux-aarch64-local.json
            e2e-step3-client-bundle-report.json
            abi-manifest-aarch64.json
            callwarden-linux-aarch64.tar.gz
            callwarden-client-linux-aarch64.tar.gz
            dist/callwarden/e2e-step2-linux-aarch64-bundle-report.json
          retention-days: 30

  linux-musl-static-build:
    name: Linux musl static build (alpine)
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    if: ${{ inputs.skip_musl != 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker (alpine container for musl build)
        run: |
          docker --version
          docker info

      - name: Build in alpine container (musl static)
        run: |
          set -euo pipefail
          # 在 alpine 容器中构建 musl 静态 Rust 扩展 + PyInstaller 产物
          # alpine 使用 musl libc，构建产物天然静态链接
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            --env CARGO_TERM_COLOR=always \
            --env PYTHONUTF8=1 \
            --env PYTHONIOENCODING=utf-8 \
            python:3.12-alpine \
            sh -c '
              set -euo pipefail
              echo "=== alpine musl 环境 ==="
              cat /etc/os-release
              echo ""
              echo "=== 安装构建依赖 ==="
              apk add --no-cache rust cargo musl-dev python3-dev py3-pip gcc g++ bash file

              echo ""
              echo "=== 构建 Rust 扩展 (musl) ==="
              python release/build.py --rust

              echo ""
              echo "=== Rust 扩展 musl 静态链接验证 ==="
              file callwarden_core.so
              # 验证不依赖 glibc
              ldd callwarden_core.so || true

              echo ""
              echo "=== 安装 Python 依赖 ==="
              pip install --no-cache-dir -r release/pyinstaller/requirements-build.txt
              pip install --no-cache-dir . --no-deps
              pip install --no-cache-dir psutil

              echo ""
              echo "=== PyInstaller 构建 ==="
              python -m PyInstaller release/pyinstaller/callwarden.spec --noconfirm --clean || {
                echo "::warning::PyInstaller 在 musl 环境下构建失败（已知问题，记录但不阻塞）"
                exit 0
              }

              echo ""
              echo "=== 验证 frozen 产物 ==="
              ./dist/callwarden/cw --version || true
              ./dist/callwarden/cw --help >/dev/null || true

              echo ""
              echo "=== 生成 musl ABI manifest ==="
              python - <<PYEOF > abi-manifest-musl-x86_64.json
          import json
          import platform
          import sys
          from pathlib import Path

          so_files = list(Path("dist/callwarden").rglob("callwarden_core.so")) if Path("dist/callwarden").exists() else []
          supported_langs = []
          try:
              import importlib.util
              if so_files:
                  spec = importlib.util.spec_from_file_location("cw_core_musl", so_files[0])
                  mod = importlib.util.module_from_spec(spec)
                  spec.loader.exec_module(mod)
                  if hasattr(mod, "supported_languages"):
                      supported_langs = sorted(mod.supported_languages())
          except Exception as e:
              supported_langs = [f"<error: {e}>"]

          manifest = {
              "product": "callwarden",
              "platform": "linux-x86_64-musl",
              "os": {"system": platform.system(), "release": platform.release()},
              "arch": {"machine": platform.machine()},
              "libc": {"name": "musl"},
              "python": {"version": platform.python_version()},
              "rust_extension": {"found": bool(so_files), "path": str(so_files[0]) if so_files else None},
              "parser_abi": {"supported_languages": supported_langs, "language_count": len(supported_langs)},
          }
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PYEOF
              cat abi-manifest-musl-x86_64.json
            '

      - name: Upload musl manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-linux-musl
          path: |
            abi-manifest-musl-x86_64.json
          retention-days: 30
          if-no-files-found: warn

      - name: Job summary
        if: always()
        run: |
          {
            echo "## P2-H Linux aarch64 + musl E2E 报告"
            echo ""
            echo "### aarch64 任务"
            echo "- E2E 报告: e2e-report-linux-aarch64-local.json"
            echo "- client/agent bundle: e2e-step3-client-bundle-report.json"
            echo "- ABI manifest: abi-manifest-aarch64.json"
            echo ""
            echo "### musl 任务"
            echo "- 在 alpine 容器中构建 musl 静态 Rust 扩展"
            echo "- ABI manifest: abi-manifest-musl-x86_64.json"
            echo "- PyInstaller 在 musl 环境下可能存在已知兼容性问题"
          } >> "$GITHUB_STEP_SUMMARY"
