name: Call Warden Bootstrap Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  bootstrap-gate:
    name: Bootstrap Gate Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0  # 完整历史，用于 git_head 对比

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable

      - name: Build Rust extension
        run: python release/build.py --rust

      - name: Install Call Warden
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"

      - name: Refresh code graph
        run: |
          cw refresh --all

      - name: Run bootstrap gate
        run: |
          python -m callwarden.cicd.bootstrap_check
