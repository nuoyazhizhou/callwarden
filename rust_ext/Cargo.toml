[package]
name = "callwarden-core"
version = "0.3.23"
edition = "2021"
description = "Call Warden 高性能 PyO3 扩展：parse 热路径 + 批量余弦相似度"

[lib]
name = "callwarden_core"
# rlib: 供 cw_daemon bin 和 cargo test 二进制链接（不依赖 Python host 提供符号）
# cdylib: 供 Python 通过 import 加载的 .pyd/.so
crate-type = ["cdylib", "rlib"]

[[bin]]
# P0-3 修复（问题 5）：Cargo binary name 统一为连字符 cw-daemon
# 原 cw_daemon（下划线）与 release/linux/build_packages.sh 复制的 cw-daemon（连字符）
# 和 systemd unit ExecStart 的 cw_daemon（下划线）三方不一致，导致 deb 安装后
# systemd 启动找不到二进制（/usr/bin/cw-daemon != /usr/bin/cw_daemon）。
# Linux 文件系统习惯用连字符（如 systemd-analyze、network-manager）。
name = "cw-daemon"
path = "src/bin/cw_daemon.rs"

[[bin]]
# Phase 5-1 A.2: cw CLI binary（clap 命令树骨架，59 子命令对齐 Python cli/main.py）
# 独立 binary，仅依赖 clap，不依赖 PyO3/callwarden_core lib
name = "cw"
path = "src/bin/cw_cli.rs"

[[bin]]
# Phase 5-2 Slice 1: cw-client binary（daemon RPC client，clap 骨架 + ping 子命令）
# 依赖 callwarden_core lib（daemon::client::unix::UnixDaemonRpcClient，仅 Unix）
# 跨平台编译：Windows 上 UDS 分支被 #[cfg(not(unix))] 替换为平台提示
# 契约：docs/design/phase5-2-slice1-daemon-client-contract.md §3.4
name = "cw-client"
path = "src/bin/cw_client.rs"

[[bin]]
# Phase 5-2 Slice 6: cw-agent binary（文件监控 + session 管理）
# 依赖 callwarden_core lib（daemon::client::AgentSession + watcher）
# 跨平台编译：Windows 上 watcher 循环被 #[cfg(not(unix))] 替换为平台提示
# 对齐 Python cli/main.py:run_agent_mode (L12023+)
name = "cw-agent"
path = "src/bin/cw_agent.rs"

[[bin]]
# 共存契约子任务2：cw-bridge（Windows 侧受限 bridge）
# 监听 loopback TCP 供 WSL 客户端访问，转发 JSON-RPC 到当前用户 SID 的 Named Pipe。
# Windows-only；非 Windows 平台打印错误退出。不打开 SQLite、不实现任务写逻辑。
name = "cw-bridge"
path = "src/bin/cw_bridge.rs"

[features]
# 默认开启 extension-module：cdylib 构建时不链接 libpython（由 Python host 提供）
# 测试时使用 `cargo test --no-default-features` 关闭此 feature，让 PyO3 链接 libpython
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[dependencies]
# P29: PyO3 升级到 0.29 以支持 Python 3.14
# extension-module 通过 [features].default 间接启用，便于测试时 --no-default-features 关闭
pyo3 = { version = "0.29" }
numpy = "0.29"
# Phase 6-3 P1: ndarray 用于 vector_topk 的 ArrayView2 类型（numpy crate 的 as_array() 返回值）
ndarray = "0.16"
# P29/P31: tree-sitter parse 热路径下沉（16 语言 grammar）
tree-sitter = "0.26"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
# P31: 其余 14 语言 grammar
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-php = "0.23"
tree-sitter-scala = "0.23"
tree-sitter-c-sharp = "0.23"
# L9 补齐：Kotlin + Swift + Elixir + HCL grammar（全部 15 语言 Rust 化）
tree-sitter-kotlin-ng = "1.1"
tree-sitter-swift = "0.7"
tree-sitter-elixir = "0.3"
tree-sitter-hcl = "1.1"
# rayon: 数据并行（替代 Python ProcessPoolExecutor，共享 grammar）
rayon = "1.10"
# 并发原语
parking_lot = "0.12"
# B-PoC: rusqlite（bundled 自带 SQLite + FTS5，跨平台一致）
rusqlite = { version = "0.31", features = ["bundled"] }
# Phase 4: arc-swap 用于 GraphSnapshot 原子发布（无锁读路径）
arc-swap = "1.7"
# Phase 2 daemon: libc 用于 SO_PEERCRED（仅 unix）
libc = "0.2"
# Phase 5: notify 用于文件监听（跨平台 fs events）
notify = "7.0"
crossbeam-channel = "0.5"
# Phase 5.2: sha2 用于文件内容 hash diff（排除假阳性 watcher 事件）
sha2 = "0.10"
# Phase 4-3 P2: hmac 用于审计链签名（HMAC-SHA256）
hmac = "0.12"
# P6 优化：rustc-hash 提供 FxHashMap（比 SipHash 快 5-10x，非加密哈希）
rustc-hash = "2.0"
# P11 优化：memchr 提供 SIMD 加速的子串搜索（search_symbols 热路径）
memchr = "2.7"
# P5 优化：memmap2 用于 GraphStore 快照 dump/load 零拷贝加载
memmap2 = "0.9"
# P5 优化:bytemuck 用于 GraphSymbol/CallEdge 的零拷贝字节转换
bytemuck = { version = "1.21", features = ["derive"] }
# R1 daemon 协议层：serde_json 用于 JSON-RPC 帧序列化
# Phase 5-3: 启用 preserve_order feature 保持插入顺序，对齐 Python json.dumps 行为
# （Python 3.7+ dict 有序，json.dumps 按插入顺序输出；serde_json 默认按字母排序）
serde_json = { version = "1.0", features = ["preserve_order"] }
# E5 coverage import：解析 Cobertura XML，保持与 Python db_coverage 语义一致
quick-xml = "0.37"
# R5 staging_log：serde 用于 StagingEntry 的 Serialize/Deserialize derive
serde = { version = "1.0", features = ["derive"] }
# R1 daemon 协议层：thiserror 用于 ProtocolError 派生 Error trait
thiserror = "1.0"
# G8 daemon: base64 用于解码客户端传来的 canonical_bytes_b64（跨平台 fallback，FD 模式仅 Unix）
base64 = "0.22"
# G8 daemon: hex 用于解码客户端传来的 canonical_bytes_hex（agent_protocol.py 小文件默认路径）
hex = "0.4"
# 1D1 task-domain operation store: Unicode NFC 规范化（operation-params-c14n/v1）
unicode-normalization = "0.1.25"
# G6 CAS GC: fs2 提供跨平台文件锁（lock_exclusive），用于 CasStore::gc 和 gc_unreferenced
# 多 daemon 实例并发 GC 时与 BEGIN IMMEDIATE 形成双保险，防跨进程 mark-sweep 数据竞态
fs2 = "0.4"
# P0-L step1：getrandom 提供 OS CSPRNG（role worker credential 签发），
# 安全约束不得降级为 wall clock / PID / 可观察 hash 等弱熵源。
getrandom = "0.3"

# Phase 6-1 P2/P3: regex 用于 cross_layer_impact 正则提取 + once_cell 缓存编译后正则
regex = "1.11"
once_cell = "1.20"

# Phase 5-1 A.1: toml 用于分层配置加载（对齐 release/config_loader.py）
toml = "0.8"

# R7 cw_daemon binary + Phase 5-1 A.2 cw_cli binary：clap（CLI 参数解析）
# 跨平台依赖（cw_cli 需在 Windows/macOS/Linux 上运行）
clap = { version = "4", features = ["derive"] }

# H1: HTTP MVP transport（frozen: axum 0.8.x + hyper 1.x + tokio 1.x, HTTP/1.1 only）
# 仅用于 dev_loopback_unauthenticated 开发期 overlay；不启用 HTTP/2、WS、SSE、压缩。
axum = "0.8"
hyper = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util"] }

# R7 cw_daemon binary：signal-hook（SIGTERM/SIGINT 优雅关闭）
# Linux-only 依赖，避免 Windows/macOS 编译时引入不必要的包
[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

# D0 3.24: Windows 命名管道端点 + SDDL 安全描述符 + 对端令牌 SID
# 与 cfg(unix) signal-hook 对称：平台依赖只在对应 target 引入，Unix 侧构建不受影响
# Feature 裁剪到三类模块，不引入整包（Req 14.2, 14.5, 14.18）：
#   Win32_System_Pipes    — CreateNamedPipe / ConnectNamedPipe / DisconnectNamedPipe
#   Win32_Security        — SECURITY_DESCRIPTOR / SID / ACL / SDDL 转换
#   Win32_System_Threading — OpenProcessToken / GetTokenInformation（对端 SID 派生）
#   Win32_Foundation      — HANDLE / BOOL / ERROR_* 基础类型（上述模块的公共依赖）
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Wdk_Storage_FileSystem",
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1  # 单 codegen unit 优化极致性能
strip = "symbols"  # 发布包移除符号表，保留崩溃地址与外部 debug 产物能力
