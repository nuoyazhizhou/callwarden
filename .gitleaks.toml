# callwarden gitleaks 配置（CI-DEBT 安全门禁，2026-10-17）
#
# 触发背景：CI Security job 的 gitleaks 步骤（ci.yml: detect --source . --redact）
# 在 cargo-audit 漏洞修复（quick-xml 0.41，见 commit 21adbe7）后首次真正执行，
# 立即报 272 findings（扫全仓 1136 commits）。本机同版 gitleaks 8.18.4 复现同数。
#
# 逐条 triage（outputs/tools/gl_full.json + triage.py）：272/272 假阳性——
#   - generic-api-key 258 条：deliverables/software-company/*.json（255）+
#     docs/evidence/*.json（多数），触发字段一律是 token_hash": "<64-hex>"，
#     即 SHA-256 单向哈希（脱敏后的存储形态），不含密钥材料；
#   - private-key 2 / aws-access-token 1 / github-pat 1（共 4 条）：
#     rust_ext/src/daemon/task_prompt/redaction_tests.rs 与
#     rust_ext/tests/role_prompt_validator_negative.rs 是**脱密功能测试夹具**，
#     使用 AWS 文档公开示例 key（AKIAIOSFODNN7EXAMPLE）、伪 github-pat
#     （ghp_0123456789abcdefghijklmnopqrstuvwxyz）与占位 RSA 私钥（abc）；
#   - square-access-token 1 条：docs/testing/STATIC_AUDIT.json 静态审计报告误报；
#   - generic-api-key 1 条：rust_ext/src/daemon/cas.rs:2298 的
#     "test_r13_partial_key"——#[test] fn test_r13_partial_publish_not_hit_by_lookup
#     内的测试夹具键名。
# 交叉验证：同仓 semgrep p/secrets 扫描 = 0 findings（真实密钥不存在）。
#
# 本 allowlist 仅放行上述经逐条核实不含真实密钥的路径/字面量；默认规则集
# （[extend] useDefault = true）对全仓历史 + 工作树其余部分保持启用——后续
# 真实泄漏仍会被门禁捕获。注意 gitleaks v8.18.4 不会自动发现本文件，
# ci.yml 的 gitleaks 步骤须显式传 --config .gitleaks.toml。

title = "callwarden gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "逐条核实的假阳性：哈希字段产物 / 脱密功能测试夹具"
paths = [
  'deliverables[\\/]software-company[\\/].*\.json',
  'docs[\\/]evidence[\\/].*\.json',
  'docs[\\/]testing[\\/]STATIC_AUDIT\.json',
  'rust_ext[\\/]src[\\/]daemon[\\/]task_prompt[\\/]redaction_tests\.rs',
  'rust_ext[\\/]tests[\\/]role_prompt_validator_negative\.rs',
]
# cas.rs 单测夹具键名（generic-api-key 误报，见文件头注释）
regexes = [
  'test_r13_partial_key',
]
